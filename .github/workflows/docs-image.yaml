name: Docs Image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/docs-image.yaml'
      - 'services/docs/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build docs image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/docs/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: opendepot-docs:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test docs image
        run: |
          docker run -d --name docs -p 8080:8080 opendepot-docs:pr
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/docs/ || true)
            if [ "$code" = "200" ]; then
              echo "docs image served /docs/ with HTTP 200"
              exit 0
            fi
            sleep 1
          done
          docker logs docs
          exit 1
