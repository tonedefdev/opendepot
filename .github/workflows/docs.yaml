name: Docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - docs/**
      - overrides/**
      - mkdocs.yml
      - CONTRIBUTING.md
      - chart/opendepot/README.md
  workflow_dispatch:
    inputs:
      rebuild_helm_index:
        description: Rebuild the Helm index from all published chart assets
        required: true
        type: boolean
        default: false

concurrency:
  group: gh-pages-publisher
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MkDocs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system dependencies for social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Fetch existing Helm chart index
        run: |
          git fetch origin gh-pages
          git show FETCH_HEAD:index.yaml > /tmp/helm-index.yaml 2>/dev/null || true

      - name: Build MkDocs site
        run: mkdocs build

      - name: Preserve Helm chart index
        run: |
          if [ -s /tmp/helm-index.yaml ]; then
            cp /tmp/helm-index.yaml site/index.yaml
          fi

      - name: Rebuild Helm chart index
        if: inputs.rebuild_helm_index == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/rebuild-helm-index.py --output site/index.yaml

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          ghp-import --no-jekyll --push --force site
