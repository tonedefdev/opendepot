name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '.releaserc.json'
              - 'services/**'
            chart:
              - '.github/workflows/release.yaml'
              - 'chart/**'
              - 'services/**'

  semantic-release:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  chart-release:
    needs: [changes]
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Package chart
        run: helm package chart/opendepot --destination .cr-release-packages
      - name: Install chart-releaser
        env:
          CR_VERSION: v1.6.1
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/${CR_VERSION}/chart-releaser_${CR_VERSION#v}_linux_amd64.tar.gz"
          curl -sSLo checksums.txt "https://github.com/helm/chart-releaser/releases/download/${CR_VERSION}/checksums.txt"
          grep "chart-releaser_${CR_VERSION#v}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cr"
          tar -xzf cr.tar.gz -C "$RUNNER_TEMP/cr" cr
          echo "$RUNNER_TEMP/cr" >> "$GITHUB_PATH"
      - name: Upload chart release
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --git-repo "${GITHUB_REPOSITORY#*/}" \
            --commit "$(git rev-parse HEAD)" \
            --skip-existing \
            --make-release-latest=false
      - name: Update chart index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-index
          cr index \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --git-repo "${GITHUB_REPOSITORY#*/}" \
            --push
