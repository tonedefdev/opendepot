name: Build Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  IMAGE_REGISTRY: gcr.io/opendepot-495604/opendepot

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service:
          - name: version-controller
            context: .
            path: services/version
            buildArgs: "INCLUDE_TRIVY=true"
            tagSuffix: ""
          - name: module-controller
            context: .
            path: services/module
            buildArgs: ""
            tagSuffix: ""
          - name: depot-controller
            context: .
            path: services/depot
            buildArgs: ""
            tagSuffix: ""
          - name: server
            context: .
            path: services/server
            buildArgs: ""
            tagSuffix: ""
          - name: provider-controller
            context: .
            path: services/provider
            buildArgs: ""
            tagSuffix: ""
          - name: ui
            context: services/ui
            path: services/ui
            buildArgs: ""
            tagSuffix: ""
    name: Build ${{ matrix.service.name }} (arm64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.service.name }}
          flavor: |
            suffix=${{ matrix.service.tagSuffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.path }}/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.buildArgs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All ARM64 Docker images built successfully"
            exit 0
          else
            echo "❌ Docker image build failed"
            exit 1
          fi
