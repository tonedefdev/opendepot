# Third-party CVEs in the upstream OpenTofu and Trivy binaries bundled into the
# version-controller and server images when INCLUDE_TOFU / INCLUDE_TRIVY is set.
# These binaries come from pinned upstream releases (checksum-verified) and are not
# patched or rebuilt here. Each entry is scoped to the binary path so the same CVE
# still fails the scan if it appears in an OpenDepot binary. Entries are removed
# once an upstream release bundles the fixed dependency.
# Tracked in https://github.com/tonedefdev/opendepot/issues/98.
vulnerabilities:
  - id: CVE-2026-56864
    paths:
      - usr/local/bin/tofu
    statement: "golang.org/x/mod sumdb integrity bypass in the upstream OpenTofu 1.13.9 release; no upstream release bundles the fixed dependency yet."
  - id: CVE-2026-56865
    paths:
      - usr/local/bin/tofu
    statement: "golang.org/x/mod sumdb/tlog supply-chain issue in the upstream OpenTofu 1.13.9 release; no upstream release bundles the fixed dependency yet."
  - id: CVE-2026-78669
    paths:
      - usr/local/bin/tofu
    statement: "golang.org/x/net http2 denial of service compiled into the upstream OpenTofu 1.13.9 release binary; no upstream release bundles the fixed dependency yet."
  - id: CVE-2026-78661
    paths:
      - usr/local/bin/tofu
    statement: "golang.org/x/net HTTP/2 issue compiled into the upstream OpenTofu 1.13.9 release binary; no upstream release bundles the fixed dependency yet."
  - id: CVE-2026-84445
    paths:
      - usr/local/bin/tofu
    statement: "google.golang.org/grpc denial of service via malformed RPC in the upstream OpenTofu 1.13.9 release binary; no upstream release bundles the fixed dependency yet."
  - id: CVE-2026-116587
    paths:
      - usr/local/bin/tofu
    statement: "github.com/go-jose/go-jose/v4 vulnerability compiled into the upstream OpenTofu 1.13.9 release binary; no upstream release bundles the fixed dependency yet."
