apiVersion: v2
name: opendepot
description: A Helm chart for deploying OpenDepot, a cloud-native OpenTofu Registry
type: application
version: 0.11.1
appVersion: "0.11.0"
keywords:
  - terraform
  - opentofu
  - module-registry
  - provider-registry
  - kubernetes
maintainers:
  - name: Tony Owens
    email: tony.owens@defdev.io
dependencies:
  - name: dex
    version: "0.24.*"
    repository: https://charts.dexidp.io
    condition: dex.enabled
  - name: kube-prometheus-stack
    alias: monitoring
    version: "89.2.*"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.bundled.enabled
