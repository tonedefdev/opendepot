{{- if and .Values.oci.builds.enabled .Values.oci.builds.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendepot-build
  namespace: {{ .Values.oci.builds.namespace }}
spec:
  podSelector:
    matchLabels:
      opendepot.defdev.io/build: "true"
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      podSelector:
        matchLabels:
          app: version-controller
    ports:
    - protocol: TCP
      port: {{ .Values.oci.builds.broker.port }}
  {{- $exceptCIDRs := .Values.oci.builds.networkPolicy.exceptCIDRs }}
  {{- range $cidr := .Values.oci.builds.networkPolicy.egressCIDRs }}
  {{- $family := contains ":" $cidr }}
  {{- $excepts := list }}
  {{- range $except := $exceptCIDRs }}
  {{- if eq (contains ":" $except) $family }}
  {{- $excepts = append $excepts $except }}
  {{- end }}
  {{- end }}
  - to:
    - ipBlock:
        cidr: {{ $cidr | quote }}
        {{- with $excepts }}
        except:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: version-controller-build-broker
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: version-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.oci.builds.namespace }}
      podSelector:
        matchLabels:
          opendepot.defdev.io/build: "true"
    ports:
    - protocol: TCP
      port: {{ .Values.oci.builds.broker.port }}
  - ports:
    - protocol: TCP
      port: 8082
{{- end }}
