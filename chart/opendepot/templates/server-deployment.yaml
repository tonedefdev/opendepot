{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Values.global.namespace }}
  labels:
    app: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        {{- if or .Values.storage.filesystem.enabled .Values.assembly.enabled }}
        fsGroup: 65532
        {{- end }}
      {{- if and .Values.storage.filesystem.enabled .Values.storage.filesystem.hostPath }}
      initContainers:
      - name: fix-permissions
        image: busybox:1.37
        command: ["sh", "-c", "chown -R 65532:65532 {{ .Values.storage.filesystem.mountPath }}"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: modules
          mountPath: {{ .Values.storage.filesystem.mountPath }}
      {{- end }}
      containers:
      - name: server
        image: "{{ .Values.server.image.repository }}:{{ default (default .Chart.AppVersion .Values.global.image.tag) .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        {{- if .Values.server.anonymousAuth }}
        - --anonymous-auth
        {{- end }}
        {{- if .Values.server.useBearerToken }}
        - --use-bearer-token
        {{- end }}
        {{- if .Values.server.policyManagement.enabled }}
        - --policy-management-enabled
        {{- end }}
        {{- if and .Values.server.oidc.enabled .Values.server.oidc.dexProxy.enabled }}
        {{- if not .Values.dex.enabled }}
        {{- fail "server.oidc.dexProxy.enabled requires dex.enabled=true" }}
        {{- end }}
        {{- if not .Values.server.oidc.issuerUrl }}
        {{- fail "server.oidc.dexProxy.enabled requires server.oidc.issuerUrl to be set to the external, publicly reachable issuer URL (e.g. https://opendepot.example.com/dex)" }}
        {{- end }}
        {{- end }}
        {{- if .Values.server.oidc.enabled }}
        - --oidc-client-id={{ .Values.server.oidc.clientId }}
        {{- if .Values.server.oidc.issuerUrl }}
        - --oidc-issuer-url={{ .Values.server.oidc.issuerUrl }}
        {{- else if .Values.dex.enabled }}
        - --oidc-issuer-url=http://{{ .Release.Name }}-dex.{{ .Values.global.namespace }}.svc.cluster.local:5556/dex
        {{- else }}
        {{- required "server.oidc.issuerUrl is required when server.oidc.enabled=true and dex.enabled=false" nil }}
        {{- end }}
        {{- if .Values.server.oidc.groupsClaim }}
        - --oidc-groups-claim={{ .Values.server.oidc.groupsClaim }}
        {{- end }}
        {{- if .Values.server.oidc.allowServiceAccountFallback }}
        - --oidc-allow-sa-fallback
        {{- end }}
        {{- if .Values.server.oidc.allowClientCredentials }}
        - --oidc-allow-client-credentials
        {{- end }}
        {{- if and .Values.ui.enabled .Values.ui.oidc.enabled .Values.ui.oidc.clientId }}
        - --oidc-ui-client-id={{ .Values.ui.oidc.clientId }}
        {{- end }}
        {{- if .Values.server.oidc.authzUrl }}
        - --oidc-authz-url={{ .Values.server.oidc.authzUrl }}
        {{- end }}
        {{- if .Values.server.oidc.tokenUrl }}
        - --oidc-token-url={{ .Values.server.oidc.tokenUrl }}
        {{- end }}
        {{- if .Values.server.oidc.dexProxy.enabled }}
        - --oidc-dex-proxy-enabled
        - --oidc-dex-internal-url=http://{{ .Release.Name }}-dex.{{ .Values.global.namespace }}.svc.cluster.local:5556/dex
        {{- end }}
        - --namespace={{ .Values.global.namespace }}
        {{- end }}
        {{- if and .Values.storage.filesystem.enabled .Values.storage.filesystem.mountPath }}
        - --filesystem-mount-path={{ .Values.storage.filesystem.mountPath }}
        {{- end }}
        {{- if .Values.assembly.enabled }}
        - --assembly-enabled
        - --registry-host={{ include "opendepot.registryHost" . }}
        {{- if .Values.assembly.validationRegistryUrl }}
        - --assembly-validation-registry-url={{ .Values.assembly.validationRegistryUrl }}
        {{- end }}
        {{- if .Values.assembly.validationCACertPath }}
        - --assembly-validation-ca-cert-path={{ .Values.assembly.validationCACertPath }}
        {{- end }}
        {{- $assemblyValidationURL := .Values.assembly.validationRegistryUrl | default .Values.ui.baseUrl | urlParse }}
        {{- if eq (get $assemblyValidationURL "scheme") "http" }}
        - --assembly-registry-insecure
        {{- end }}
        - --tofu-bin-path={{ .Values.assembly.tofuBinPath }}
        - --assembly-work-dir={{ .Values.assembly.workDir }}
        - --assembly-init-timeout={{ .Values.assembly.initTimeout }}
        - --assembly-validate-timeout={{ .Values.assembly.validateTimeout }}
        - --assembly-max-request-bytes={{ int .Values.assembly.maxRequestBytes }}
        - --assembly-max-nodes={{ int .Values.assembly.maxNodes }}
        - --assembly-max-output-bytes={{ int .Values.assembly.maxOutputBytes }}
        {{- end }}
        - --stats-lookback={{ .Values.server.stats.lookback }}
        - --stats-query-timeout={{ .Values.server.stats.queryTimeout }}
        {{- if .Values.server.stats.prometheusURL }}
        - --stats-prometheus-url={{ .Values.server.stats.prometheusURL }}
        {{- else if .Values.monitoring.enabled }}
        - --stats-prometheus-url=http://{{ .Release.Name }}-monitoring-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090
        {{- end }}
        {{- if .Values.server.tls.enabled }}
        - --tls-cert-path={{ .Values.server.tls.certPath }}
        - --tls-cert-key={{ .Values.server.tls.keyPath }}
        {{- end }}
        env:
        - name: OPENDEPOT_MODULE_DOWNLOAD_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-module-download-token" .Release.Name) .Values.server.moduleDownloadTokenSecretName }}
              key: token
        {{- if .Values.server.gpg.secretName }}
        envFrom:
        - secretRef:
            name: {{ .Values.server.gpg.secretName }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.server.service.targetPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.server.metrics.port }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /.well-known/terraform.json
            port: http
            scheme: {{ ternary "HTTPS" "HTTP" .Values.server.tls.enabled }}
          periodSeconds: 2
          failureThreshold: 45
        readinessProbe:
          httpGet:
            path: /.well-known/terraform.json
            port: http
            scheme: {{ ternary "HTTPS" "HTTP" .Values.server.tls.enabled }}
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /.well-known/terraform.json
            port: http
            scheme: {{ ternary "HTTPS" "HTTP" .Values.server.tls.enabled }}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          {{- if and (not .Values.global.developmentMode) (not .Values.storage.filesystem.enabled) }}
          readOnlyRootFilesystem: true
          {{- end }}
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        {{- if or .Values.server.tls.enabled .Values.storage.filesystem.enabled .Values.assembly.enabled }}
        volumeMounts:
        {{- if .Values.server.tls.enabled }}
        - name: tls
          mountPath: {{ .Values.server.tls.certPath | dir }}
          readOnly: true
        {{- end }}
        {{- if .Values.storage.filesystem.enabled }}
        - name: modules
          mountPath: {{ .Values.storage.filesystem.mountPath }}
        {{- end }}
        {{- if .Values.assembly.enabled }}
        - name: assembly-workspace
          mountPath: {{ .Values.assembly.workDir }}
        {{- end }}
        {{- end }}
      {{- if or .Values.server.tls.enabled .Values.storage.filesystem.enabled .Values.assembly.enabled }}
      volumes:
      {{- if .Values.server.tls.enabled }}
      - name: tls
        secret:
          secretName: opendepot-tls
      {{- end }}
      {{- if .Values.storage.filesystem.enabled }}
      - name: modules
        {{- if .Values.storage.filesystem.hostPath }}
        hostPath:
          path: {{ .Values.storage.filesystem.hostPath }}
          type: DirectoryOrCreate
        {{- else }}
        persistentVolumeClaim:
          claimName: opendepot-modules
        {{- end }}
      {{- end }}
      {{- if .Values.assembly.enabled }}
      - name: assembly-workspace
        emptyDir:
          sizeLimit: {{ .Values.assembly.workspaceSizeLimit }}
      {{- end }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
