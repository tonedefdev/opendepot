{{- if .Values.provider.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app: provider-controller
    control-plane: controller
spec:
  replicas: {{ .Values.provider.replicaCount }}
  selector:
    matchLabels:
      app: provider-controller
      control-plane: controller
  template:
    metadata:
      labels:
        app: provider-controller
        control-plane: controller
    spec:
      serviceAccountName: provider-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      initContainers:
      - name: init-restart-proc
        image: busybox:1.37
        command: ["touch", "/tmp/.restart-proc"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        volumeMounts:
        - name: provider-tmp
          mountPath: /tmp
      containers:
      - name: provider-controller
        image: "{{ .Values.provider.image.repository }}:{{ default (default .Chart.AppVersion .Values.global.image.tag) .Values.provider.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- if .Values.provider.zapLogLevel }}
        args:
        - --zap-log-level={{ .Values.provider.zapLogLevel }}
        {{- end }}
        {{- if .Values.rbac.scopeToNamespace }}
        env:
        - name: WATCH_NAMESPACE
          value: {{ .Values.global.namespace }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          {{- if not .Values.global.developmentMode }}
          readOnlyRootFilesystem: true
          {{- end }}
        resources:
          {{- toYaml .Values.provider.resources | nindent 10 }}
        volumeMounts:
        - name: provider-tmp
          mountPath: /tmp
      volumes:
      - name: provider-tmp
        emptyDir: {}
      {{- with .Values.provider.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provider.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provider.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
