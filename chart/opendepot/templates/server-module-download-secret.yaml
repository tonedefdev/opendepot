{{- if and .Values.server.enabled (not .Values.server.moduleDownloadTokenSecretName) }}
{{- $secretName := printf "%s-module-download-token" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Values.global.namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  token: {{ if $existing }}{{ index $existing.data "token" | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | quote }}{{ end }}
{{- end }}{{- if and .Values.server.enabled (not .Values.server.moduleDownloadTokenSecretName) }}
