{{- if .Values.version.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app: version-controller
    control-plane: controller
spec:
  replicas: {{ .Values.version.replicaCount }}
  selector:
    matchLabels:
      app: version-controller
      control-plane: controller
  template:
    metadata:
      labels:
        app: version-controller
        control-plane: controller
    spec:
      serviceAccountName: version-controller
      automountServiceAccountToken: false
      securityContext:
        {{- if not (and .Values.storage.filesystem.enabled .Values.storage.filesystem.hostPath) }}
        runAsNonRoot: true
        {{- end }}
        runAsUser: 65532
        fsGroup: 65532
      initContainers:
      - name: init-service-account
        image: busybox:1.37
        command: ["sh", "-c", "cat /var/run/opendepot-serviceaccount/ca.crt > /var/run/secrets/kubernetes.io/serviceaccount/ca.crt && cat /var/run/opendepot-serviceaccount/namespace > /var/run/secrets/kubernetes.io/serviceaccount/namespace && cat /var/run/opendepot-serviceaccount/token > /var/run/secrets/kubernetes.io/serviceaccount/token"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        volumeMounts:
        - name: service-account
          mountPath: /var/run/opendepot-serviceaccount
        - name: service-account-runtime
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      {{- if and .Values.storage.filesystem.enabled .Values.storage.filesystem.hostPath }}
      - name: fix-permissions
        image: busybox:1.37
        command: ["sh", "-c", "chown -R 65532:65532 {{ .Values.storage.filesystem.mountPath }}"]
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: modules
          mountPath: {{ .Values.storage.filesystem.mountPath }}
      {{- end }}
      - name: init-restart-proc
        image: busybox:1.37
        command: ["touch", "/tmp/.restart-proc"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        volumeMounts:
        - name: version-tmp
          mountPath: /tmp
      {{- $tag := toString (default (default .Chart.AppVersion .Values.global.image.tag) .Values.version.image.tag) }}
      containers:
      - name: token-refresh-helper
        image: "{{ .Values.version.image.repository }}:{{ $tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/version-controller"]
        args:
        - --token-refresh-helper=true
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 65532
        resources:
          limits:
            cpu: 10m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        volumeMounts:
        - name: service-account
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      - name: version-controller
        image: "{{ .Values.version.image.repository }}:{{ $tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - --scan-agents={{ .Values.scanning.agentScanning }}
        - "--agent-allowed-domains={{ .Values.scanning.agentAllowedDomains }}"
        - --jev-enabled={{ .Values.scanning.jev.enabled }}
        - "--jev-endpoint={{ .Values.scanning.jev.endpoint }}"
        {{- if .Values.scanning.enabled }}
        - --scanning-enabled=true
        - --scan-block-on-critical={{ .Values.scanning.blockOnCritical }}
        - --scan-block-on-high={{ .Values.scanning.blockOnHigh }}
        - --scan-modules=true
        {{- if .Values.scanning.providerScanning }}
        - --trivy-cache-dir={{ .Values.scanning.cacheMountPath }}
        - --scan-offline={{ .Values.scanning.offline }}
        {{- end }}
        {{- end }}
        {{- if .Values.assembly.enabled }}
        - --assembly-enabled=true
        - --tofu-bin-path={{ .Values.assembly.tofuBinPath }}
        - --schema-extraction-timeout={{ .Values.assembly.extractionTimeout }}
        {{- end }}
        {{- if .Values.version.zapLogLevel }}
        - --zap-log-level={{ .Values.version.zapLogLevel }}
        {{- end }}
        env:
        {{- if .Values.rbac.scopeToNamespace }}
        - name: WATCH_NAMESPACE
          value: {{ .Values.global.namespace }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.version.gpg.secretName }}
        - name: OPENDEPOT_PROVIDER_GPG_PRIVATE_KEY_BASE64
          valueFrom:
            secretKeyRef:
              name: {{ .Values.version.gpg.secretName }}
              key: OPENDEPOT_PROVIDER_GPG_PRIVATE_KEY_BASE64
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          {{- toYaml .Values.version.resources | nindent 10 }}
        volumeMounts:
        - name: service-account-runtime
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        - name: version-tmp
          mountPath: /tmp
        {{- if .Values.storage.filesystem.enabled }}
        - name: modules
          mountPath: {{ .Values.storage.filesystem.mountPath }}
        {{- end }}
        {{- if .Values.scanning.providerScanning }}
        - name: trivy-cache
          mountPath: {{ .Values.scanning.cacheMountPath }}
        {{- end }}
      volumes:
      - name: service-account
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: service-account-runtime
        emptyDir: {}
      - name: version-tmp
        emptyDir: {}
      {{- if .Values.storage.filesystem.enabled }}
      - name: modules
        {{- if .Values.storage.filesystem.hostPath }}
        hostPath:
          path: {{ .Values.storage.filesystem.hostPath }}
          type: DirectoryOrCreate
        {{- else }}
        persistentVolumeClaim:
          claimName: opendepot-modules
        {{- end }}
      {{- end }}
      {{- if .Values.scanning.providerScanning }}
      - name: trivy-cache
        persistentVolumeClaim:
          claimName: opendepot-trivy-cache
      {{- end }}
      {{- with .Values.version.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.version.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.version.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
