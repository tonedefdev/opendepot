{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app: agent-controller
    control-plane: controller
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      app: agent-controller
      control-plane: controller
  template:
    metadata:
      labels:
        app: agent-controller
        control-plane: controller
    spec:
      serviceAccountName: agent-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: deployment-controller
        image: "{{ .Values.agent.image.repository }}:{{ default (default .Chart.AppVersion .Values.global.image.tag) .Values.agent.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- if .Values.agent.zapLogLevel }}
        args:
        - --zap-log-level={{ .Values.agent.zapLogLevel }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          {{- if not .Values.global.developmentMode }}
          readOnlyRootFilesystem: true
          {{- end }}
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
