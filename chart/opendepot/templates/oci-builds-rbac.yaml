{{- if .Values.oci.builds.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: version-controller-builds
  namespace: {{ .Values.oci.builds.namespace }}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: version-controller-builds
  namespace: {{ .Values.oci.builds.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: version-controller-builds
subjects:
- kind: ServiceAccount
  name: version-controller
  namespace: {{ .Values.global.namespace }}
{{- end }}
