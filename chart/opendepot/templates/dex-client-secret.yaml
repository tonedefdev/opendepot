{{- if and .Values.dex.enabled .Values.server.oidc.enabled }}
{{- $requiresServerSecret := false }}
{{- range .Values.dex.config.staticClients }}
{{- if eq (default "" .secretEnv) "OPENDEPOT_DEX_CLIENT_SECRET" }}
{{- $requiresServerSecret = true }}
{{- end }}
{{- end }}
{{- if $requiresServerSecret }}
{{- if not .Values.server.oidc.clientSecretName }}
{{- fail "server.oidc.clientSecretName must reference an existing Secret when Dex and OIDC are enabled" }}
{{- end }}
{{- end }}
{{- end }}
