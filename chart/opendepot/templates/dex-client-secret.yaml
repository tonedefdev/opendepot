{{- if and .Values.dex.enabled .Values.server.oidc.enabled }}
{{- $requiresServerSecret := false }}
{{- range .Values.dex.config.staticClients }}
{{- if eq (default "" .secretEnv) "OPENDEPOT_DEX_CLIENT_SECRET" }}
{{- $requiresServerSecret = true }}
{{- end }}
{{- end }}
{{- if $requiresServerSecret }}
{{- if ne (default "" .Values.server.oidc.clientSecretName) "opendepot-dex-client-secret" }}
{{- fail "server.oidc.clientSecretName must be opendepot-dex-client-secret when Dex and OIDC are enabled. Dex reads this Secret through dex.envFrom, which must use the same name." }}
{{- end }}
{{- end }}
{{- end }}
