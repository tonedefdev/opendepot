{{- if and .Values.dex.enabled .Values.server.oidc.enabled }}
{{- $requiresServerSecret := false }}
{{- range .Values.dex.config.staticClients }}
{{- if eq (default "" .secretEnv) "OPENDEPOT_DEX_CLIENT_SECRET" }}
{{- $requiresServerSecret = true }}
{{- end }}
{{- end }}
{{- if $requiresServerSecret }}
{{- $secretName := default "" .Values.server.oidc.clientSecretName }}
{{- if not $secretName }}
{{- fail "server.oidc.clientSecretName is required when dex.enabled and server.oidc.enabled are true and a Dex static client uses secretEnv OPENDEPOT_DEX_CLIENT_SECRET." }}
{{- end }}
{{- $found := false }}
{{- range .Values.dex.envFrom }}
{{- if and .secretRef (eq (default "" .secretRef.name) $secretName) }}
{{- $found = true }}
{{- end }}
{{- end }}
{{- if not $found }}
{{- fail (printf "dex.envFrom must include a secretRef with name %q, matching server.oidc.clientSecretName. Dex reads the client secret through dex.envFrom, and Helm cannot template one value from another." $secretName) }}
{{- end }}
{{- end }}
{{- end }}
