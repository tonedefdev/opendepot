{{- if (fromJson (include "opendepot.iac.value" (dict "root" . "key" "enabled" "default" true))).v }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iac-controller
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
