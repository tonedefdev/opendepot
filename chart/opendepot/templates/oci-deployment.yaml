{{- if .Values.oci.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app: oci-controller
    control-plane: controller
spec:
  replicas: {{ .Values.oci.replicaCount }}
  selector:
    matchLabels:
      app: oci-controller
      control-plane: controller
  template:
    metadata:
      labels:
        app: oci-controller
        control-plane: controller
    spec:
      serviceAccountName: oci-controller
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: {{ .Values.oci.runAsGroup }}
      containers:
      - name: oci-controller
        image: "{{ .Values.oci.image.repository }}:{{ default (default .Chart.AppVersion .Values.global.image.tag) .Values.oci.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - "--oci-allowed-registries={{ join "," .Values.oci.allowedRegistries }}"
        {{- if .Values.oci.builds.enabled }}
        - --oci-builds-enabled=true
        - "--oci-builds-allowed-repo-owners={{ join "," .Values.oci.builds.allowedRepoOwners }}"
        {{- end }}
        {{- if .Values.oci.zapLogLevel }}
        - --zap-log-level={{ .Values.oci.zapLogLevel }}
        {{- end }}
        {{- if or .Values.rbac.scopeToNamespace .Values.coverage.enabled }}
        env:
        {{- if .Values.rbac.scopeToNamespace }}
        - name: WATCH_NAMESPACE
          value: {{ .Values.global.namespace }}
        {{- end }}
        {{- if .Values.coverage.enabled }}
        - name: GOCOVERDIR
          value: /coverage
        {{- end }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          {{- if not .Values.global.developmentMode }}
          readOnlyRootFilesystem: true
          {{- end }}
        resources:
          {{- toYaml .Values.oci.resources | nindent 10 }}
        {{- if .Values.coverage.enabled }}
        volumeMounts:
        - name: coverage
          mountPath: /coverage
        {{- end }}
      {{- with .Values.oci.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oci.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oci.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.coverage.enabled }}
      volumes:
      - name: coverage
        emptyDir: {}
      {{- end }}
{{- end }}
