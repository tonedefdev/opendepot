{{- if (fromJson (include "opendepot.iac.value" (dict "root" . "key" "enabled" "default" true))).v }}
{{- $replicaCount := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "replicaCount" "default" 1))).v }}
{{- $zapLogLevel := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "zapLogLevel" "default" ""))).v }}
{{- $repository := (fromJson (include "opendepot.iac.value" (dict "root" . "section" "image" "key" "repository" "default" "ghcr.io/tonedefdev/opendepot/iac-controller"))).v }}
{{- $imageTag := (fromJson (include "opendepot.iac.value" (dict "root" . "section" "image" "key" "tag" "default" ""))).v }}
{{- $runAsGroup := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "runAsGroup" "default" 65532))).v }}
{{- $resources := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "resources" "default" (dict "requests" (dict "cpu" "100m" "memory" "128Mi" "ephemeral-storage" "128Mi") "limits" (dict "cpu" "1000m" "memory" "512Mi"))))).v }}
{{- $nodeSelector := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "nodeSelector" "default" (dict)))).v }}
{{- $tolerations := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "tolerations" "default" (list)))).v }}
{{- $affinity := (fromJson (include "opendepot.iac.value" (dict "root" . "key" "affinity" "default" (dict)))).v }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iac-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app: iac-controller
    control-plane: controller
spec:
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      app: iac-controller
      control-plane: controller
  template:
    metadata:
      labels:
        app: iac-controller
        control-plane: controller
    spec:
      serviceAccountName: iac-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: {{ $runAsGroup }}
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-restart-proc
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["touch", "/tmp/.restart-proc"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
          runAsGroup: {{ $runAsGroup }}
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        volumeMounts:
        - name: iac-tmp
          mountPath: /tmp
      containers:
      - name: iac-controller
        image: "{{ $repository }}:{{ default (default .Chart.AppVersion .Values.global.image.tag) $imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- if $zapLogLevel }}
        args:
        - --zap-log-level={{ $zapLogLevel }}
        {{- end }}
        {{- if or .Values.rbac.scopeToNamespace .Values.coverage.enabled }}
        env:
        {{- if .Values.rbac.scopeToNamespace }}
        - name: WATCH_NAMESPACE
          value: {{ .Values.global.namespace }}
        {{- end }}
        {{- if .Values.coverage.enabled }}
        - name: GOCOVERDIR
          value: /coverage
        {{- end }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          {{- if not .Values.global.developmentMode }}
          readOnlyRootFilesystem: true
          {{- end }}
          runAsGroup: {{ $runAsGroup }}
        resources:
          {{- toYaml $resources | nindent 10 }}
        volumeMounts:
        - name: iac-tmp
          mountPath: /tmp
        {{- if .Values.coverage.enabled }}
        - name: coverage
          mountPath: /coverage
        {{- end }}
      volumes:
      - name: iac-tmp
        emptyDir: {}
      {{- if .Values.coverage.enabled }}
      - name: coverage
        emptyDir: {}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
