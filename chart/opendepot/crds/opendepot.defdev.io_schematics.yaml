---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: schematics.opendepot.defdev.io
spec:
  group: opendepot.defdev.io
  names:
    kind: Schematic
    listKind: SchematicList
    plural: schematics
    singular: schematic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The kind of assembly that the Schematic describes. One of 'Tofu'
        or 'Agent'
      jsonPath: .spec.assemblyKind
      name: Kind
      type: string
    - description: Whether the Schematic document is valid
      jsonPath: .status.valid
      name: Valid
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schematic is the Schema for the schematics API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SchematicSpec defines the desired state of Schematic.
            properties:
              assemblyKind:
                description: The kind of assembly that the document describes. One
                  of 'Tofu' or 'Agent'. It can't change after the Schematic is created.
                enum:
                - Tofu
                - Agent
                type: string
                x-kubernetes-validations:
                - message: assemblyKind is immutable
                  rule: self == oldSelf
              description:
                description: A short description of the Schematic.
                maxLength: 2048
                type: string
              displayName:
                description: The human readable name of the Schematic.
                maxLength: 128
                minLength: 1
                type: string
              document:
                description: The assembly document. Its structure depends on assemblyKind.
                  The server and the reconciler limit it to 256 KiB.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              origin:
                description: The origin of the Schematic.
                properties:
                  importedAt:
                    description: The time at which the Schematic bundle was imported.
                    format: date-time
                    type: string
                  importedDigest:
                    description: The sha256 digest of the bundle document that was
                      imported.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  importedFrom:
                    description: The location that the Schematic bundle was imported
                      from.
                    maxLength: 512
                    type: string
                  source:
                    description: How the Schematic was created. One of 'Builtin',
                      'Import', 'Duplicate', or 'Canvas'.
                    enum:
                    - Builtin
                    - Import
                    - Duplicate
                    - Canvas
                    type: string
                required:
                - source
                type: object
              schemaVersion:
                description: The version of the Schematic document format.
                enum:
                - opendepot.schematic.v1
                type: string
              tags:
                description: The tags that describe the Schematic.
                items:
                  maxLength: 32
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 16
                type: array
              tutorial:
                description: |-
                  Whether the Schematic is a tutorial. Tutorial documents can contain placeholder nodes and can't be exported
                  to OpenTofu or agent files.
                type: boolean
            required:
            - assemblyKind
            - displayName
            - document
            - schemaVersion
            type: object
          status:
            description: SchematicStatus defines the observed state of Schematic.
            properties:
              conditions:
                description: The observed conditions of the Schematic. The condition
                  types are 'Ready' and 'ReferencesResolved'.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              diagnostics:
                description: The problems found while validating the document.
                items:
                  description: SchematicDiagnostic is a problem found while validating
                    a Schematic document.
                  properties:
                    code:
                      description: A stable code that identifies the problem.
                      maxLength: 64
                      type: string
                    message:
                      description: A human readable description of the problem.
                      maxLength: 512
                      type: string
                    path:
                      description: The location of the problem in the document.
                      maxLength: 256
                      type: string
                    severity:
                      description: How serious the problem is. One of 'Error' or 'Warning'.
                      enum:
                      - Error
                      - Warning
                      type: string
                  required:
                  - code
                  - message
                  - severity
                  type: object
                maxItems: 50
                type: array
              digest:
                description: The sha256 digest of the canonical document.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              observedGeneration:
                description: The most recent generation of the Schematic that the
                  controller has observed.
                format: int64
                type: integer
              references:
                description: The resources that the document refers to, and whether
                  each one can currently be used.
                items:
                  description: SchematicReference is a resource that a Schematic document
                    refers to.
                  properties:
                    kind:
                      description: The kind of the referenced resource. One of 'Module',
                        'Provider', 'Skill', 'Agent', or 'MCPServer'.
                      enum:
                      - Module
                      - Provider
                      - Skill
                      - Agent
                      - MCPServer
                      type: string
                    name:
                      description: The name of the referenced resource.
                      type: string
                    namespace:
                      description: The namespace of the referenced resource.
                      type: string
                    state:
                      description: Whether the referenced resource can currently be
                        used.
                      enum:
                      - Available
                      - Missing
                      - Yanked
                      - Blocked
                      - Hidden
                      - Placeholder
                      type: string
                    version:
                      description: The version constraint of the referenced resource.
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  - state
                  type: object
                maxItems: 256
                type: array
              valid:
                description: Whether the document is valid.
                type: boolean
            required:
            - valid
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
