                  (SKILL.md or the agent .md). Only populated for Skill and Agent Versions.
                properties:
                  fileName:
                    description: The name of the source entry file, for example SKILL.md,
                      code-review.agent.md or code-review.md.
                    maxLength: 255
                    type: string
                  key:
                    description: The key within the ConfigMap's data holding the base64
                      encoded definition file.
                    type: string
                  name:
                    description: The name of the ConfigMap holding the definition
                      file.
                    type: string
                required:
                - fileName
                - key
                - name
                type: object
              helmChart:
                description: HelmChart holds the chart metadata parsed from Chart.yaml.
                  Only populated for Helm OCIArtifact Versions.
                properties:
                  appVersion:
                    description: The version of the application that the chart deploys.
                    maxLength: 255
                    type: string
                  dependencies:
                    description: The chart dependencies declared by the chart.
                    items:
                      description: HelmChartDependency is a dependency declared by
                        a Helm chart.
                      properties:
                        name:
                          description: The name of the dependency chart.
                          maxLength: 512
                          type: string
                        repository:
                          description: The repository that hosts the dependency chart.
                          maxLength: 512
                          type: string
                        version:
                          description: The version constraint of the dependency chart.
                          maxLength: 512
                          type: string
                      type: object
                    maxItems: 64
                    type: array
                  deprecated:
                    description: Whether the chart is deprecated.
                    type: boolean
                  description:
                    description: A short description of the chart.
                    maxLength: 1024
                    type: string
                  keywords:
                    description: The keywords declared by the chart.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 32
                    type: array
                  kubeVersion:
                    description: The Kubernetes version constraint declared by the
                      chart.
                    maxLength: 255
                    type: string
                  name:
                    description: The name of the chart.
                    maxLength: 255
                    type: string
                  version:
                    description: The version of the chart.
                    maxLength: 255
                    type: string
                type: object
              jevAssessment:
                description: |-
                  JevAssessment holds the TypeSafe Jev assessment of this Version. Only populated when Jev
                  is enabled and the source opts in with jevSecretRef.
                properties:
                  assessedChunks:
                    description: The number of part entries Jev scored.
                    format: int32
                    maximum: 16
                    minimum: 0
                    type: integer
                  blockReasons:
                    description: The Jev block reasons. When the assessment is exempted,
                      this lists the reasons that were cleared.
                    items:
                      type: string
                    type: array
                  blocked:
                    description: |-
                      Whether Jev blocks the Version: a threshold, a Critical risk level, a part below minConfidence,
                      content Jev could not read, Jev disabled on the controller, or an assessment that could not complete.
                      False when a matching jevExemption cleared every block reason.
                    type: boolean
                  chunkCount:
                    description: |-
                      The planned number of parts. It is exact when it is at most 16. Above 16 it is a lower bound,
                      and no Jev call was made.
                    format: int32
                    minimum: 0
                    type: integer
                  chunks:
                    description: One entry per scored or attempted part, sorted by
                      label.
                    items:
                      description: JevChunkResult holds the Jev result for one planned
                        part of a Version's content.
                      properties:
                        error:
                          description: The reason the part failed or was not sent,
                            redacted.
                          maxLength: 512
                          type: string
                        fileCount:
                          description: The exact number of files in this part.
                          format: int32
                          minimum: 0
                          type: integer
                        files:
                          description: The paths whose content, or part of it, is
                            in this part, entry file included.
                          items:
                            maxLength: 256
                            type: string
                          maxItems: 32
                          type: array
                        index:
                          description: The 1-based planned part.
                          format: int32
                          maximum: 16
                          minimum: 1
                          type: integer
                        inputTokens:
                          description: The input tokens Jev reported for this part.
                            Calls that fail report no usage, so this is 0 for them.
                          format: int64
                          minimum: 0
                          type: integer
                        label:
                          description: The part index plus any halving suffix, for
                            example 3, 3a or 3ab.
                          maxLength: 4
                          pattern: ^([1-9]|1[0-6])[ab]{0,2}$
                          type: string
                        riskConfidence:
                          description: The confidence of the part's risk assessment.
                          type: number
                        riskLevel:
                          description: The risk level assigned to the part.
                          enum:
                          - Minimal
                          - Low
                          - Moderate
                          - High
                          - Critical
                          type: string
                        riskScore:
                          description: The risk score assigned to the part.
                          type: number
                        safeProbability:
                          description: The probability that the part is safe to use.
                          type: number
                        status:
                          description: The outcome of the part.
                          enum:
                          - Scored
                          - Failed
                          - TokenLimitExceeded
                          - NotSent
                          type: string
                      required:
                      - fileCount
                      - index
                      - label
                      - status
                      type: object
                    maxItems: 16
                    type: array
                  contentDigest:
                    description: The lowercase hex SHA-256 of the archive that Jev
                      assessed. It equals hex(base64-decode(status.checksum)).
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  destructiveProbability:
                    description: The probability that the Version directs destructive
                      or irreversible actions.
                    type: number
                  error:
                    description: |-
                      A redacted description of the error that prevented the assessment from completing, or why the
                      assessment is incomplete.
                    type: string
                  evaluatedAt:
                    description: The RFC3339 timestamp at which the assessment was
                      evaluated.
                    type: string
                  exempted:
                    description: Whether a jevExemption cleared the block reasons
                      for this assessment.
                    type: boolean
                  exemptedBy:
                    description: The name of the ScanPolicy whose jevExemption cleared
                      the block reasons.
                    type: string
                  exemptionExpires:
                    description: The expiry of the jevExemption that cleared the block
                      reasons. Nil means the exemption never expires.
                    format: date-time
                    type: string
                  exemptionReason:
                    description: The reason given by the jevExemption that cleared
                      the block reasons.
                    type: string
                  exfiltrationProbability:
                    description: The probability that the Version directs data, files,
                      or credentials to an external destination.
                    type: number
                  hiddenInstructionsProbability:
                    description: The probability that the Version contains hidden
                      or obfuscated instructions.
                    type: number
                  injectionProbability:
                    description: The probability that the Version is susceptible to
                      prompt injection.
                    type: number
                  inputTokens:
                    description: |-
                      The total input tokens Jev reported across every part it processed. It is the sum of each chunk's inputTokens,
                      and it includes parts that Jev scored but that were then marked Failed.
                    format: int64
                    minimum: 0
                    type: integer
                  model:
                    description: The Jev model that produced the assessment, as returned
                      by the API.
                    type: string
                  needsReview:
                    description: Whether the assessment requires a manual review.
                      A Critical risk level sets it, and an exemption does not change
                      it.
                    type: boolean
                  remoteExecutionProbability:
                    description: The probability that the Version directs the agent
                      to download and run remote code.
                    type: number
                  retryCount:
                    description: |-
                      The number of failed attempts since the last ForceSync, which resets it to 0. 401 and 403 failures
                      do not count. The first attempt is attempt 0, and this is 1 after the first failure. Automatic
                      retries stop once it exceeds jevMaxRetries (default 3, so attempts 0 to 3).
                    format: int32
                    minimum: 0
                    type: integer
                  riskConfidence:
                    description: The confidence of the risk assessment. This describes
                      answer concentration, not correctness.
                    type: number
                  riskLevel:
                    description: The risk level assigned to the Version.
                    enum:
                    - Minimal
                    - Low
                    - Moderate
                    - High
                    - Critical
                    type: string
                  riskScore:
                    description: The risk score assigned to the Version.
                    type: number
                  safeProbability:
                    description: The probability that the Version is safe to use.
                    type: number
                  scopeMismatchProbability:
                    description: The probability that the Version asks the agent to
                      do things beyond its description.
                    type: number
                  skippedFileCount:
                    description: The total number of skipped files. SkippedFiles holds
                      at most 32 of them.
                    format: int32
                    minimum: 0
                    type: integer
                  skippedFiles:
                    description: Files that Jev could not read. Any entry here blocks
                      the Version.
                    items:
                      description: JevSkippedFile identifies a file that Jev could
                        not read.
                      properties:
                        path:
                          description: The path of the skipped file.
                          maxLength: 256
                          type: string
                        reason:
                          description: Why the file was skipped.
                          enum:
                          - Withheld
                          - Binary
                          type: string
                      required:
                      - path
                      - reason
                      type: object
                    maxItems: 32
                    type: array
                  versionName:
                    description: The name of the Version object this assessment belongs
                      to.
                    type: string
                required:
                - blocked
                - evaluatedAt
                - needsReview
                type: object
              jevExemptionGovernance:
                description: |-
                  JevExemptionGovernance reports which ScanPolicy governs this Version's Jev exemptions and how its
                  content digest matches them. Only populated when a Jev assessment is recorded.
                properties:
                  governingPolicy:
                    description: The name of the ScanPolicy that governs this Version.
                      Empty when no ScanPolicy governs it.
                    type: string
                  governingPriority:
                    description: The priority of the governing ScanPolicy.
                    format: int32
                    type: integer
                  matchingExpires:
                    description: The expiry of the matching jevExemptions entry. Nil
                      means the entry never expires or no entry matches.
                    format: date-time
                    type: string
                  matchingPolicy:
                    description: The name of a ScanPolicy whose jevExemptions entry
                      matches this Version's content digest. Empty when none matches.
                    type: string
                  matchingPriority:
                    description: The priority of the ScanPolicy named in matchingPolicy.
                    format: int32
                    type: integer
                  matchingState:
                    description: The state of the matching jevExemptions entry. See
                      the JevMatchingState constants for the values.
                    enum:
                    - none
                    - exempted
                    - superseded
                    - expired
                    - noDigest
                    type: string
                  superseded:
                    description: Whether the matching entry belongs to a ScanPolicy
                      other than the governing one, so it does not apply.
                    type: boolean
                required:
                - governingPolicy
                - governingPriority
                - matchingPolicy
                - matchingPriority
                - matchingState
                - superseded
                type: object
              jevUnblock:
                description: |-
                  JevUnblock reports what this Version needs before its Jev block can be cleared. It is computed from the same
                  governance decision as JevExemptionGovernance. Only populated when a Jev assessment is recorded.
                properties:
                  digest:
                    description: The content digest the state was computed for.
                    type: string
                  expires:
                    description: The expiry of the matching jevExemptions entry. Nil
                      means the entry never expires or no entry matches.
                    format: date-time
                    type: string
                  governingPolicy:
                    description: |-
                      The name of the ScanPolicy that governs this Version. Empty when no ScanPolicy governs it, or when the name is
                      hidden from the caller.
                    type: string
                  governingPriority:
                    description: The priority of the governing ScanPolicy.
                    format: int32
                    type: integer
                  matchingPolicy:
                    description: |-
                      The name of a ScanPolicy whose jevExemptions entry matches the digest. Empty when none matches, or when the name
                      is hidden from the caller.
                    type: string
                  matchingPriority:
                    description: The priority of the ScanPolicy named in matchingPolicy.
                    format: int32
                    type: integer
                  namesHidden:
                    description: |-
                      Whether the policy names were withheld from the caller, such as for OIDC callers. The state is still computed
                      before the names are withheld.
                    type: boolean
                  state:
                    description: |-
                      The unblock state. none means the Version is not blocked and has no exemption in force. no-digest means the
                      Version has no content digest to match. needs-entry means no jevExemptions entry matches the digest.
                      superseded means the matching entry is in a ScanPolicy that does not govern the Version. expired means the
                      governing entry has expired. pending means an active exemption exists but the Version is still blocked. exempted
                      means the exemption is in force. unknown means the state cannot be determined.
                    enum:
                    - none
                    - no-digest
                    - needs-entry
                    - superseded
                    - expired
                    - pending
                    - exempted
                    - unknown
                    type: string
                required:
                - governingPriority
                - matchingPriority
                - namesHidden
                - state
                type: object
              mcpMetadata:
                description: |-
                  MCPMetadata holds the server metadata parsed from an MCPServer Version's server.json and package.
                  Only populated for MCPServer Versions.
                properties:
                  description:
                    description: A short description of the MCP server.
                    maxLength: 1024
                    type: string
                  packageDigest:
                    description: The sha256 digest of the package that the Version
                      vendors.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  platforms:
                    description: The PyPI wheel platforms that were vendored into
                      the Version.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  runnable:
                    description: Whether the MCP server can run. False for the Source
                      type.
                    type: boolean
                  serverName:
                    description: The name of the MCP server.
                    maxLength: 255
                    type: string
                  transport:
                    description: The transport that the MCP server speaks.
                    enum:
                    - stdio
                    - streamable-http
                    type: string
                required:
                - runnable
                type: object
              ociBuild:
                description: |-
                  OCIBuild holds the in-cluster build state of an Image OCIArtifact Version that is built from a build source.
                  Only populated for OCIArtifact Versions that have a build source. It is for display and debugging, and the
                  server serves only status.ociManifest.
                properties:
                  buildID:
                    description: The random identifier of the build. It names the
                      build Jobs and the staged context.
                    pattern: ^[a-z0-9]{20}$
                    type: string
                  completedAt:
                    description: The time that the build completed.
                    format: date-time
                    type: string
                  contextDigest:
                    description: The sha256 digest of the staged build context.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  fetchTokenHash:
                    description: The sha256 hash of the one-time token that the build
                      Job uses to fetch the build context. The token itself is never
                      stored.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  message:
                    description: A human-readable message about the build's phase.
                    maxLength: 1024
                    type: string
                  phase:
                    description: The build's phase.
                    enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    type: string
                  platforms:
                    description: The build status of each platform.
                    items:
                      description: OCIBuildPlatformStatus describes the build Job
                        of one platform in an OCIBuildStatus.
                      properties:
                        jobName:
                          description: The name of the build Job for this platform.
                          maxLength: 63
                          type: string
                        manifestDigest:
                          description: The sha256 digest of the manifest that this
                            platform's build produced.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        message:
                          description: A human-readable message about this platform's
                            build.
                          maxLength: 1024
                          type: string
                        phase:
                          description: The build Job's phase for this platform.
                          enum:
                          - Pending
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        platform:
                          description: The platform that the build Job builds, such
                            as linux/amd64.
                          pattern: ^[a-z0-9]+/[a-z0-9]+(/[a-z0-9.]+)?$
                          type: string
                      required:
                      - jobName
                      - phase
                      - platform
                      type: object
                    maxItems: 16
                    type: array
                  sourceCommit:
                    description: The full commit SHA that the Git tag resolved to
                      when the build started.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  sourceTag:
                    description: The Git tag that the build was started from.
                    maxLength: 255
                    type: string
                  startedAt:
                    description: The time that the build started.
                    format: date-time
                    type: string
                  uploadTokenHash:
                    description: The sha256 hash of the one-time token that the build
                      Job uses to upload the OCI layout. The token itself is never
                      stored.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                required:
                - buildID
                - phase
                - sourceCommit
                - sourceTag
                type: object
              ociManifest:
                description: |-
                  OCIManifest holds the OCI manifest or index that this OCIArtifact Version serves. Only populated for
                  OCIArtifact Versions.
                properties:
                  artifactType:
                    description: The artifact type declared by the manifest, if any.
                    maxLength: 255
                    type: string
                  digest:
                    description: The sha256 digest of the manifest or index that is
                      served. It never changes after the Version syncs.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  mediaType:
                    description: The media type of the manifest or index.
                    maxLength: 255
                    type: string
                  platforms:
                    description: The platforms, such as linux/amd64, that the index
                      serves.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  signatureVerified:
                    description: Whether the upstream cosign signature was verified.
                      Only set when a signature check ran.
                    type: boolean
                  tagDrift:
                    description: True when the upstream tag now points to a different
                      digest than the one served. The served digest never changes.
                    type: boolean
                  totalSizeBytes:
                    description: The total size in bytes of the manifest's blobs.
                    format: int64
                    minimum: 0
                    type: integer
                  upstreamDigest:
                    description: The digest that the upstream tag pointed to when
                      the Version was synced.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                required:
                - digest
                - mediaType
                - totalSizeBytes
                type: object
              ociScan:
                description: OCIScan is the Trivy scan result for an OCIArtifact Version.
                  Only populated for OCIArtifact Versions when scanning is enabled.
                properties:
                  findings:
                    description: The list of findings produced by the scan.
                    items:
                      description: SecurityFinding represents a single vulnerability
                        finding from a Trivy scan.
                      properties:
                        exempted:
                          description: |-
                            Whether a ScanPolicy exempted this finding from blocking reconciliation. Exempted
                            findings are still reported so that they remain visible and auditable.
                          type: boolean
                        exemptedBy:
                          description: The name of the ScanPolicy that exempted this
                            finding.
                          type: string
                        exemptionReason:
                          description: The justification recorded on the ScanPolicy
                            exemption that covered this finding.
                          type: string
                        fixedVersion:
                          description: The minimum version of the package that resolves
                            the vulnerability, if known.
                          type: string
                        installedVersion:
                          description: The version of the package currently in use.
                          type: string
                        pkgName:
                          description: The name of the package containing the vulnerability.
                          type: string
                        severity:
                          description: 'The severity of the vulnerability: CRITICAL,
                            HIGH, MEDIUM, LOW, or UNKNOWN.'
                          type: string
                        title:
                          description: A short description of the vulnerability.
                          type: string
                        vulnerabilityID:
                          description: The CVE or GHSA identifier for the vulnerability.
                          type: string
                      required:
                      - installedVersion
                      - pkgName
                      - severity
                      - vulnerabilityID
                      type: object
                    type: array
                  scannedAt:
                    description: The RFC3339 timestamp at which the source scan completed.
                    type: string
                required:
                - scannedAt
                type: object
              providerSchemaRef:
                description: |-
                  ProviderSchemaRef references the reduced provider schema stored in the object
                  storage backend for this provider Version. Only populated for provider Version
                  resources whose OS/arch matches the controller's own platform.
                properties:
                  digest:
                    description: The SHA256 digest of the uncompressed reduced schema,
                      as a hex string.
                    type: string
                  extractedAt:
                    description: The RFC3339 timestamp at which the schema was extracted.
                    type: string
                  key:
                    description: The storage key of the gzipped reduced schema object.
                    type: string
                  sizeBytes:
                    description: The size in bytes of the stored gzipped object.
                    format: int64
                    type: integer
                required:
                - digest
                - extractedAt
                - key
                - sizeBytes
                type: object
              providerSchemaStatus:
                description: |-
                  ProviderSchemaStatus records the outcome of the most recent provider schema
                  extraction attempt. Unlike ProviderSchemaRef, which is only ever set on success,
                  this field is also set when an extraction attempt fails, so the failure is
                  visible instead of the Version silently having no schema. Only populated for
                  provider Version resources whose OS/arch matches the controller's own platform.
                properties:
                  attemptedAt:
                    description: The RFC3339 timestamp of the most recent extraction
                      attempt.
                    type: string
                  message:
                    description: A human readable description of the failure. Only
                      set when state is Failed.
                    type: string
                  state:
                    description: The outcome of the most recent extraction attempt.
                    enum:
                    - Succeeded
                    - Failed
                    type: string
                required:
                - attemptedAt
                - state
                type: object
              readmeConfigMapRef:
                description: |-
                  ReadmeConfigMapRef references the ConfigMap holding this module Version's base64
                  encoded README.md content. Only populated for module Version resources when a
                  README could be resolved from Github or the module archive. It is for the README
                  only and is not used for Skill or Agent definitions.
                properties:
                  key:
                    description: The key within the ConfigMap's data holding the base64
                      encoded README content.
                    type: string
                  name:
                    description: The name of the ConfigMap holding the README content.
                    type: string
                required:
                - key
                - name
                type: object
              shaSums:
                description: ShaSums is the SHA256SUMS file for this Version, produced
                  and signed once at sync.
                type: string
              shaSumsSignature:
                description: |-
                  ShaSumsSignature is the detached signature over ShaSums, produced at sync with the
                  provider GPG signing key.
                type: string
              signingKeyFingerprint:
                description: SigningKeyFingerprint is the fingerprint of the key that
                  produced ShaSumsSignature.
                type: string
              sourceCommit:
                description: SourceCommit is the full commit SHA that was downloaded
                  for this branch Version.
                pattern: ^[0-9a-f]{40}$
                type: string
              sourceScan:
                description: |-
                  The source vulnerability scan result for this Version. Populated for provider Versions
                  (go.mod scan) and module Versions (IaC filesystem scan) when scanning is enabled.
                properties:
                  findings:
                    description: The list of findings produced by the scan.
                    items:
                      description: SecurityFinding represents a single vulnerability
                        finding from a Trivy scan.
                      properties:
                        exempted:
                          description: |-
                            Whether a ScanPolicy exempted this finding from blocking reconciliation. Exempted
                            findings are still reported so that they remain visible and auditable.
                          type: boolean
                        exemptedBy:
                          description: The name of the ScanPolicy that exempted this
                            finding.
                          type: string
                        exemptionReason:
                          description: The justification recorded on the ScanPolicy
                            exemption that covered this finding.
                          type: string
                        fixedVersion:
                          description: The minimum version of the package that resolves
                            the vulnerability, if known.
                          type: string
                        installedVersion:
                          description: The version of the package currently in use.
                          type: string
                        pkgName:
                          description: The name of the package containing the vulnerability.
                          type: string
                        severity:
                          description: 'The severity of the vulnerability: CRITICAL,
                            HIGH, MEDIUM, LOW, or UNKNOWN.'
                          type: string
                        title:
                          description: A short description of the vulnerability.
                          type: string
                        vulnerabilityID:
                          description: The CVE or GHSA identifier for the vulnerability.
                          type: string
                      required:
                      - installedVersion
                      - pkgName
                      - severity
                      - vulnerabilityID
                      type: object
                    type: array
                  scannedAt:
                    description: The RFC3339 timestamp at which the source scan completed.
                    type: string
                required:
                - scannedAt
                type: object
              syncStatus:
                description: The Version's reconciliation status.
                type: string
              synced:
                description: A flag that determines whether the Version has been successfully
                  reconciled.
                type: boolean
            required:
            - syncStatus
            - synced
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
