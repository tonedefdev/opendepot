metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: depots.opendepot.defdev.io
spec:
  group: opendepot.defdev.io
  names:
    kind: Depot
    listKind: DepotList
    plural: depots
    singular: depot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The global configuration applied to all modules managed by this
        Depot
      jsonPath: .spec.global
      name: GlobalConfig
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Depot is the Schema for the depots API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DepotSpec defines the desired state of Depot.
            properties:
              agentConfigs:
                description: The agent configuration and version details for each
                  agent that should be managed by the Depot controller.
                items:
                  description: |-
                    AgentSourceConfig is the configuration settings for a Skill or Agent and for each Version created
                    by the agent controller. The source is a directory within a Github repository so that several skills
                    or agents can be published from one monorepo.
                  properties:
                    branchPolicy:
                      description: |-
                        The policy that governs how branch commits are classified into versions. Only valid with ref.
                        The policy classifies changes and never blocks a Version.
                      properties:
                        majorThreshold:
                          default: 0.5
                          description: The probability of a MAJOR change at or above
                            which the bump is MAJOR.
                          maximum: 1
                          minimum: 0
                          type: number
                        minConfidence:
                          default: 0.5
                          description: The minimum classification confidence. A bump
                            below this confidence is flagged for review.
                          maximum: 1
                          minimum: 0
                          type: number
                        minVersionInterval:
                          default: 10m
                          description: |-
                            The minimum time between two branch versions created from the same source. Commits pushed within
                            this interval collapse into one version. Zero disables the interval. Negative values are rejected.
                          type: string
                        minorThreshold:
                          default: 0.5
                          description: The combined probability of MAJOR and MINOR
                            changes at or above which the bump is at least MINOR.
                          maximum: 1
                          minimum: 0
                          type: number
                      type: object
                    githubClientConfig:
                      description: The Github client configuration settings.
                      properties:
                        useAuthenticatedClient:
                          description: |-
                            This flag determines whether the GitHub client used to download modules
                            will be authenticated with a Github App. It's highly recommended
                            to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                            must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                            githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                            as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                            to authenticate with the Github API.
                          type: boolean
                      type: object
                    immutable:
                      description: |-
                        When true, enforces that the ChecksumSHA256 of the archive always matches the value stored in this field
                        and in any destination storage config.
                      type: boolean
                    jevPolicy:
                      description: |-
                        The thresholds that gate a Version on its Jev assessment. When omitted, or when every threshold
                        is unset, the scores are informational only. Failed assessments and content outcomes still block the Version.
                      properties:
                        maxDestructiveProbability:
                          description: The maximum destructive action probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxExfiltrationProbability:
                          description: The maximum data exfiltration probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxHiddenInstructionsProbability:
                          description: The maximum hidden instructions probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxInjectionProbability:
                          description: The maximum prompt injection probability. A
                            Version is blocked when its probability is above this
                            value.
                          type: number
                        maxRemoteExecutionProbability:
                          description: The maximum remote execution probability. A
                            Version is blocked when its probability is above this
                            value.
                          type: number
                        maxRiskScore:
                          description: The maximum risk score. A Version is blocked
                            when its risk score is above this value.
                          type: number
                        maxScopeMismatchProbability:
                          description: The maximum scope mismatch probability. A Version
                            is blocked when its probability is above this value.
                          type: number
                        minConfidence:
                          description: A Version is blocked and flagged for review
                            when any part's risk confidence is below this value.
                          type: number
                        minSafeProbability:
                          description: The minimum safe probability. A Version is
                            blocked when its safe probability is below this value.
