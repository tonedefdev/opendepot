{{ template "header.html" . }}

<section class="theme-panel">
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <label class="theme-form-label" for="login">{{ .UsernamePrompt }}</label>
      <input tabindex="1" required id="login" name="login" type="text" class="theme-form-input" placeholder="{{ .UsernamePrompt | lower }}" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row">
      <label class="theme-form-label" for="password">Password</label>
      <input tabindex="2" required id="password" name="password" type="password" class="theme-form-input" placeholder="password" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box" role="alert">
        Invalid {{ .UsernamePrompt }} and password.
      </div>
    {{ end }}

    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary">Sign in</button>
  </form>
  <p class="opendepot-account-note">Use your organization account to continue.</p>
  {{ if .BackLink }}
  <div class="theme-link-back">
    <a class="dex-subtle-text" href="{{ .BackLink }}">Choose another sign-in method</a>
  </div>
  {{ end }}
</section>

<script type="text/javascript">
  document.querySelector('form').onsubmit = function() {
    document.querySelector('#submit-login').setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
