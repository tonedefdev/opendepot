{{ template "header.html" . }}

<section class="theme-panel">
  <p class="opendepot-copy">Access your organization&apos;s modules, providers, and registry resources.</p>
  <div>
    {{ range $c := .Connectors }}
      <div class="theme-form-row">
        <a class="theme-provider-link" href="{{ $c.URL }}" target="_self">
          <button class="dex-btn theme-btn-provider" type="button">
            <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}"></span>
            <span class="dex-btn-text">Sign in with {{ $c.Name }}</span>
          </button>
        </a>
      </div>
    {{ end }}
  </div>
</section>

{{ template "footer.html" . }}
