global:
  developmentMode: true
  imagePullPolicy: IfNotPresent

monitoring:
  enabled: true
  bundled:
    enabled: true

provider:
  enabled: true
  image:
    repository: ghcr.io/tonedefdev/opendepot/provider-controller
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

module:
  image:
    repository: ghcr.io/tonedefdev/opendepot/module-controller
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

depot:
  image:
    repository: ghcr.io/tonedefdev/opendepot/depot-controller
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

version:
  zapLogLevel: 5
  image:
    repository: ghcr.io/tonedefdev/opendepot/version-controller

server:
  anonymousAuth: false
  useBearerToken: false
  policyManagement:
    enabled: true
  image:
    repository: ghcr.io/tonedefdev/opendepot/server
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
  gpg:
    secretName: opendepot-provider-gpg
  oidc:
    enabled: true
    issuerUrl: http://opendepot-dex.opendepot-system.svc.cluster.local:5556/dex
    clientId: opendepot
    clientSecret: local-test-secret
    groupsClaim: groups
    authzUrl: https://opendepot.localtest.me:8443/dex/auth
    tokenUrl: https://opendepot.localtest.me:8443/dex/token
    dexProxy:
      enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
    istio:
      enabled: false
  tls:
    enabled: true

storage:
  filesystem:
    enabled: true
    hostPath: /var/local/opendepot-modules

scanning:
  enabled: true
  providerScanning: true
  cache:
    storageClassName: standard
    accessMode: ReadWriteOnce

assembly:
  enabled: true
  validationRegistryUrl: https://server.opendepot-system.svc.cluster.local:80
  validationCACertPath: /etc/tls/ca.crt

ui:
  enabled: true
  image:
    repository: ghcr.io/tonedefdev/opendepot/ui
  baseUrl: https://opendepot.localtest.me:8443
  serverCACertPath: /etc/tls/ca.crt
  sessionPasswordSecretName: ui-session-secret
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits: null
  nginx:
    preserveHostPort: true
  oidc:
    enabled: true
    issuerUrl: http://opendepot-dex.opendepot-system.svc.cluster.local:5556/dex
    authzUrl: https://opendepot.localtest.me:8443/dex/auth
    clientId: opendepot-ui
    clientSecretName: ui-oidc-secret

dex:
  enabled: true
  envFrom:
    - secretRef:
        name: ui-oidc-secret
  image:
    repository: ghcr.io/tonedefdev/opendepot/dex
    tag: v2.45.0
  config:
    issuer: http://opendepot-dex.opendepot-system.svc.cluster.local:5556/dex
    frontend:
      dir: /srv/dex/opendepot-web
      issuer: OpenDepot
    storage:
      type: memory
    enablePasswordDB: true
    oauth2:
      responseTypes:
        - code
      grantTypes:
        - authorization_code
        - urn:ietf:params:oauth:grant-type:device_code
      skipApprovalScreen: true
    staticPasswords: []
    connectors: []
    staticClients:
      - id: opendepot-ui
        name: OpenDepot UI
        secretEnv: OPENDEPOT_UI_CLIENT_SECRET
        trustedPeers:
          - opendepot
        redirectURIs:
          - https://opendepot.localtest.me:8443/auth/callback
      - id: opendepot
        name: OpenDepot
        public: true
        redirectURIs:
          - http://localhost:10000/login
          - http://localhost:10001/login
          - http://localhost:10002/login
          - http://localhost:10003/login
          - http://localhost:10004/login
          - http://localhost:10005/login
          - http://localhost:10006/login
          - http://localhost:10007/login
          - http://localhost:10008/login
          - http://localhost:10009/login
          - http://localhost:10010/login