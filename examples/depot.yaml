apiVersion: opendepot.defdev.io/v1alpha1
kind: Depot
metadata:
  name: ui-demo-depot
  namespace: opendepot-system
spec:
  global:
    moduleConfig:
      fileFormat: zip
      immutable: true
    storageConfig:
      fileSystem:
        directoryPath: /data/modules
  moduleConfigs:
  - name: terraform-aws-key-pair
    provider: aws
    repoOwner: terraform-aws-modules
    repoUrl: https://github.com/terraform-aws-modules/terraform-aws-key-pair
    versionConstraints: '>= 2.0.0, < 2.0.4'
  - name: terraform-aws-s3-bucket
    provider: aws
    repoOwner: terraform-aws-modules
    repoUrl: https://github.com/terraform-aws-modules/terraform-aws-s3-bucket
    versionConstraints: '~> 5.15.0'
  - name: terraform-aws-kms
    provider: aws
    repoOwner: terraform-aws-modules
    repoUrl: https://github.com/terraform-aws-modules/terraform-aws-kms
    versionConstraints: '~> 4.2.0'
  - name: terraform-aws-sns
    provider: aws
    repoOwner: terraform-aws-modules
    repoUrl: https://github.com/terraform-aws-modules/terraform-aws-sns
    versionConstraints: '~> 7.1.0'
  pollingIntervalMinutes: 60
  providerConfigs:
  - architectures:
    - arm64
    name: aws
    operatingSystems:
    - linux
    versionConstraints: ~> 6.60.0