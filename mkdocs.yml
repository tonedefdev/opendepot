site_name: OpenDepot
site_description: Self-hosted OpenTofu/Terraform Module and Provider Registry for Kubernetes
site_url: https://opendepot.defdev.io/docs/
repo_url: https://github.com/tonedefdev/opendepot
repo_name: tonedefdev/opendepot
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: img/opendepot_dark_mode.svg
  favicon: img/opendepot_icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
    - header.autohide

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Local Quickstart: getting-started/quickstart.md
  - Architecture: architecture.md
  - Configuration:
    - configuration/index.md
    - Authentication:
      - authentication/index.md
      - OIDC via Dex: authentication/oidc.md
      - Managed Cluster Tokens: authentication/managed-cluster-tokens.md
      - Base64-Encoded Kubeconfig: authentication/kubeconfig.md
      - Registry Explorer UI: authentication/registry-explorer.md
    - Storage Backends:
      - storage/index.md
      - Amazon S3: storage/s3.md
      - Azure Blob Storage: storage/azure.md
      - Google Cloud Storage: storage/gcs.md
      - Local Filesystem: storage/filesystem.md
      - Pre-signed URL Redirects: storage/presigned-urls.md
    - OIDC Helm Configuration:
      - configuration/oidc/index.md
      - Core Setup: configuration/oidc/setup.md
      - Proxy and Deployment Modes: configuration/oidc/proxy.md
      - Connectors and Secrets: configuration/oidc/connectors.md
      - CI/CD Authentication: configuration/oidc/ci-cd.md
    - Vulnerability Scanning: configuration/scanning.md
    - GPG Signing: configuration/gpg.md
    - GitHub Authentication: configuration/github-auth.md
    - Namespace-Scoped Mode: configuration/namespace.md
    - TLS: configuration/tls.md
  - Guides:
    - guides/index.md
    - Users:
      - Consuming Modules: guides/modules.md
      - Consuming Providers: guides/providers.md
    - Admins:
      - GitOps with Argo CD: guides/gitops.md
      - Depot (Pull-Based): guides/depot.md
      - CI/CD Pipelines: guides/cicd.md
      - Registry Operations: guides/operations.md
      - Upgrading OpenDepot: upgrading.md
      - Migrating to OpenDepot: guides/migration.md
      - GroupBinding Access Control: guides/groupbinding.md
      - Registry Explorer UI:
        - guides/registry-explorer/index.md
        - Browse Resources and Dashboards: guides/registry-explorer/browse.md
        - Browse API: guides/registry-explorer/api.md
  - Reference:
    - reference/index.md
    - API: reference/api.md
    - Version Constraints: reference/version-constraints.md
    - Helm Chart: helm-chart.md
    - Kubernetes RBAC:
      - reference/rbac/index.md
      - Controller Permissions: reference/rbac/controller-permissions.md
      - Namespace-Scoped RBAC: reference/rbac/namespace-scoped.md
      - Pipeline Publisher Role: reference/rbac/pipeline-publisher.md
      - GroupBinding and Stats Visibility: reference/rbac/visibility.md
  - Contributing: contributing.md

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      enable_git_follow: false
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tonedefdev/opendepot
      name: OpenDepot on GitHub
  generator: false

