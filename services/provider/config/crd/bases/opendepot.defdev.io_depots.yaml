                  agent that should be managed by the Depot controller.
                items:
                  description: |-
                    AgentSourceConfig is the configuration settings for a Skill or Agent and for each Version created
                    by the agent controller. The source is a directory within a Github repository so that several skills
                    or agents can be published from one monorepo.
                  properties:
                    githubClientConfig:
                      description: The Github client configuration settings.
                      properties:
                        useAuthenticatedClient:
                          description: |-
                            This flag determines whether the GitHub client used to download modules
                            will be authenticated with a Github App. It's highly recommended
                            to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                            must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                            githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                            as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                            to authenticate with the Github API.
                          type: boolean
                      type: object
                    immutable:
                      description: |-
                        When true, enforces that the ChecksumSHA256 of the archive always matches the value stored in this field
                        and in any destination storage config.
                      type: boolean
                    jevPolicy:
                      description: |-
                        The thresholds that gate a Version on its Jev assessment. When omitted, or when every threshold
                        is unset, Jev results are informational only.
                      properties:
                        maxDestructiveProbability:
                          description: The maximum destructive action probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxExfiltrationProbability:
                          description: The maximum data exfiltration probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxHiddenInstructionsProbability:
                          description: The maximum hidden instructions probability.
                            A Version is blocked when its probability is above this
                            value.
                          type: number
                        maxInjectionProbability:
                          description: The maximum prompt injection probability. A
                            Version is blocked when its probability is above this
                            value.
                          type: number
                        maxRemoteExecutionProbability:
                          description: The maximum remote execution probability. A
                            Version is blocked when its probability is above this
                            value.
                          type: number
                        maxRiskScore:
                          description: The maximum risk score. A Version is blocked
                            when its risk score is above this value.
                          type: number
                        maxScopeMismatchProbability:
                          description: The maximum scope mismatch probability. A Version
                            is blocked when its probability is above this value.
                          type: number
                        minConfidence:
                          description: |-
                            The minimum risk confidence. A Version whose risk confidence is below this value is flagged
                            for review but is never blocked.
                          type: number
                        minSafeProbability:
                          description: The minimum safe probability. A Version is
                            blocked when its safe probability is below this value.
