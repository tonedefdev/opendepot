---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: scanpolicies.opendepot.defdev.io
spec:
  group: opendepot.defdev.io
  names:
    kind: ScanPolicy
    listKind: ScanPolicyList
    plural: scanpolicies
    singular: scanpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The precedence of this policy; highest wins
      jsonPath: .spec.priority
      name: Priority
      type: integer
    - description: The minimum severity that blocks reconciliation
      jsonPath: .spec.severityThreshold
      name: Threshold
      type: string
    - description: The number of Versions matched by this policy
      jsonPath: .status.matchedVersions
      name: Matched
      type: integer
    - description: The number of exemptions currently in effect
      jsonPath: .status.activeExemptions
      name: Active
      type: integer
    - description: The higher priority policy shadowing this one
      jsonPath: .status.supersededBy
      name: SupersededBy
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScanPolicy is the Schema for the scanpolicies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScanPolicySpec defines the desired state of ScanPolicy.
            properties:
              exemptions:
                description: The findings that must not block reconciliation for the
                  matched Versions.
                items:
                  description: |-
                    ScanExemption declares a set of scan findings that must not block reconciliation.
                    A finding is exempted when it matches every populated field of the exemption.
                  properties:
                    expires:
                      description: |-
                        The time at which this exemption stops applying. Once it has passed the covered
                        findings block again. When omitted the exemption never expires.
                      format: date-time
                      type: string
                    pkgNames:
                      description: |-
                        The package names this exemption covers, such as 'stdlib' or 'golang.org/x/net'.
                        Matching is exact; the single literal '*' matches every package. When omitted
                        every package is covered.
                      items:
                        type: string
                      type: array
                    reason:
                      description: The justification for this exemption, so that every
                        exemption remains auditable.
                      minLength: 1
                      type: string
                    scanTypes:
                      description: The scan types this exemption applies to. When
                        omitted every scan type is covered.
                      items:
                        enum:
                        - binary
                        - source
                        - module
                        type: string
                      type: array
                    severities:
                      description: |-
                        The severities this exemption covers. Matching is exact and case insensitive; the
                        single literal '*' matches every severity. When omitted every severity is covered.
                      items:
                        type: string
                      type: array
                    vulnerabilityIDs:
                      description: |-
                        The vulnerability or misconfiguration identifiers this exemption covers, such as
                        'CVE-2024-1234' or 'aws-0057'. Matching is exact; the single literal '*' matches
                        every identifier. When omitted every identifier is covered.
                      items:
                        type: string
                      type: array
                  required:
                  - reason
                  type: object
                type: array
              priority:
                default: 0
                description: |-
                  The precedence of this policy. When more than one ScanPolicy matches a Version the
                  policy with the highest priority wins outright and supplies both the severity
                  threshold and the exemption set; lower priority policies are ignored entirely rather
                  than merged. Ties are broken by the oldest creation timestamp, then by name ascending.
                type: integer
              selector:
                description: |-
                  A label selector matched against the labels of the Version resources this policy
                  applies to. A Version matches when the selector matches it or when any entry in
                  targetRefs matches it. When both selector and targetRefs are omitted the policy
                  applies to every Version in its namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              severityThreshold:
                description: |-
                  The minimum severity that blocks reconciliation for the matched Versions. This
                  overrides the version controller's --scan-block-on-critical and --scan-block-on-high
                  flags. 'NONE' disables blocking entirely for the matched Versions. When omitted the
                  controller flags remain in effect as the baseline.
                enum:
                - CRITICAL
                - HIGH
                - MEDIUM
                - LOW
                - NONE
                type: string
              targetRefs:
                description: An explicit list of Module or Provider resources this
                  policy applies to.
                items:
                  description: ScanPolicyTargetRef identifies the Module or Provider
                    resources a ScanPolicy applies to.
                  properties:
                    kind:
                      description: The kind of resource this reference targets. Either
                        'Module' or 'Provider'.
                      enum:
                      - Module
                      - Provider
                      type: string
                    name:
                      description: |-
                        The name of the Module or Provider resource. Matching is exact; the single
                        literal '*' matches every resource of the given kind in the namespace.
                      minLength: 1
                      type: string
                    versions:
                      description: |-
                        A comma-separated list of version constraints such as '1.2.1' or '>= 1.0.0, < 2.0.0'
                        or '~> 1.0.0'. Constraints use AND semantics, so a version must satisfy the full
                        expression. When omitted the reference matches every version of the resource.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
            type: object
          status:
            description: ScanPolicyStatus defines the observed state of ScanPolicy.
            properties:
              activeExemptions:
                description: The number of exemptions that are currently in effect.
                type: integer
              conditions:
                description: The observed conditions of the ScanPolicy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiredExemptions:
                description: The number of exemptions whose expiry has passed and
                  no longer apply.
                type: integer
              matchedVersions:
                description: The number of Version resources in this namespace currently
                  matched by this policy.
                type: integer
              supersededBy:
                description: |-
                  The name of the higher priority ScanPolicy that shadows this policy for every Version
                  it matches. Empty when this policy wins for at least one Version, or when it matches
                  no Versions at all.
                type: string
            required:
            - activeExemptions
            - expiredExemptions
            - matchedVersions
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
