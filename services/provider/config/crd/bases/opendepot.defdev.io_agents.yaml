---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agents.opendepot.defdev.io
spec:
  group: opendepot.defdev.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The latest version of the agent
      jsonPath: .status.latestVersion
      name: LatestVersion
      type: string
    - description: The source repository URL of the agent
      jsonPath: .spec.agentSourceConfig.repoUrl
      name: Source
      type: string
    - description: Whether the Agent has synced successfully
      jsonPath: .status.synced
      name: Synced
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the Agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of a OpenDepot Agent.
            properties:
              agentSourceConfig:
                description: The configuration details for the agent that will be
                  used to create each AgentVersion
                properties:
                  branchPolicy:
                    description: |-
                      The policy that governs how branch commits are classified into versions. Only valid with ref.
                      The policy classifies changes and never blocks a Version.
                    properties:
                      majorThreshold:
                        default: 0.5
                        description: The probability of a MAJOR change at or above
                          which the bump is MAJOR.
                        maximum: 1
                        minimum: 0
                        type: number
                      minConfidence:
                        default: 0.5
                        description: The minimum classification confidence. A bump
                          below this confidence is flagged for review.
                        maximum: 1
                        minimum: 0
                        type: number
                      minVersionInterval:
                        default: 10m
                        description: |-
                          The minimum time between two branch versions created from the same source. Commits pushed within
                          this interval collapse into one version. Zero disables the interval. Negative values are rejected.
                        type: string
                      minorThreshold:
                        default: 0.5
                        description: The combined probability of MAJOR and MINOR changes
                          at or above which the bump is at least MINOR.
                        maximum: 1
                        minimum: 0
                        type: number
                    type: object
                  githubClientConfig:
                    description: The Github client configuration settings.
                    properties:
                      useAuthenticatedClient:
                        description: |-
                          This flag determines whether the GitHub client used to download modules
                          will be authenticated with a Github App. It's highly recommended
                          to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                          must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                          githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                          as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                          to authenticate with the Github API.
                        type: boolean
                    type: object
                  immutable:
                    description: |-
                      When true, enforces that the ChecksumSHA256 of the archive always matches the value stored in this field
                      and in any destination storage config.
                    type: boolean
                  jevPolicy:
                    description: |-
                      The thresholds that gate a Version on its Jev assessment. When omitted, or when every threshold
                      is unset, Jev results are informational only.
                    properties:
                      maxDestructiveProbability:
                        description: The maximum destructive action probability. A
                          Version is blocked when its probability is above this value.
                        type: number
                      maxExfiltrationProbability:
                        description: The maximum data exfiltration probability. A
                          Version is blocked when its probability is above this value.
                        type: number
                      maxHiddenInstructionsProbability:
                        description: The maximum hidden instructions probability.
                          A Version is blocked when its probability is above this
                          value.
                        type: number
                      maxInjectionProbability:
                        description: The maximum prompt injection probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      maxRemoteExecutionProbability:
                        description: The maximum remote execution probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      maxRiskScore:
                        description: The maximum risk score. A Version is blocked
                          when its risk score is above this value.
                        type: number
                      maxScopeMismatchProbability:
                        description: The maximum scope mismatch probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      minConfidence:
                        description: |-
                          The minimum risk confidence. A Version whose risk confidence is below this value is flagged
                          for review but is never blocked.
                        type: number
                      minSafeProbability:
                        description: The minimum safe probability. A Version is blocked
                          when its safe probability is below this value.
                        type: number
                    type: object
                  jevSecretRef:
                    description: |-
                      A reference to the key in a Secret in the same namespace that holds the TypeSafe Jev token.
                      The key defaults to 'jevToken' when omitted. Jev only runs when the version controller has
                      Jev enabled and this reference is set.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  name:
                    description: |-
                      The name of the skill or agent. If omitted, the name of the Skill or Agent resource
                      is used in its place.
                    type: string
                  path:
                    description: |-
                      The path within the repository to the directory that contains the skill or agent.
                      If omitted, the repository root is used.
                    type: string
                  platform:
                    description: |-
                      The agent platform that the skill or agent targets. The frontmatter keys are validated against
                      that platform's known keys. When omitted, the keys of every supported platform are accepted.
                    enum:
                    - agentskills
                    - claude
                    - copilot
                    - codex
                    - opencode
                    - pi
                    type: string
                  ref:
                    description: |-
                      The name of a Git branch to follow instead of tags. Setting ref selects branch mode, where each new
                      commit that touches the source path becomes a Version. Setting ref together with versionConstraints
                      is rejected.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[A-Za-z0-9._+/-]+$
                    type: string
                  repoOwner:
                    description: Owner of the Github repository.
                    type: string
                  repoUrl:
                    description: The full URL of the Github repository.
                    type: string
                  storageConfig:
                    description: The external storage configuration settings.
                    properties:
                      azureStorage:
                        properties:
                          accountName:
                            description: The Azure Storage Account name.
                            type: string
                          accountUrl:
                            description: The Azure Storage Account URL.
                            type: string
                          resourceGroup:
                            description: The Azure Resource Group where the Azure
                              Storage Account is located.
                            type: string
                          subscriptionID:
                            description: The Azure subscription ID where the Azure
                              Storage Account is located.
                            type: string
                        required:
                        - accountName
                        - accountUrl
                        - resourceGroup
                        - subscriptionID
                        type: object
                      fileSystem:
                        description: The configuration settings for storing Versions
                          on a local filesystem.
                        properties:
                          directoryPath:
                            description: The directory path on the file system where
                              the Version will be stored.
                            type: string
                        type: object
                      gcs:
                        description: The configuration settings for storing Versions
                          in a Google Cloud Storage bucket.
                        properties:
                          bucket:
                            description: The GCS bucket name.
                            type: string
                        required:
                        - bucket
                        type: object
                      presign:
                        description: Presign is the optional configuration for pre-signed
                          URL generation.
                        properties:
                          enabled:
                            description: When true, download requests are redirected
                              to the storage backend via a pre-signed URL.
                            type: boolean
                          fallbackToProxy:
                            default: true
                            description: |-
                              When true, if pre-sign generation fails the server falls back to proxying the download.
                              Defaults to true.
                            type: boolean
                          ttl:
                            default: 15m
                            description: |-
                              TTL controls how long the pre-signed URL remains valid (e.g. "15m", "1h").
                              If omitted, defaults to 15 minutes.
                            type: string
                        type: object
                      s3:
                        description: The configuration settings for storing Versions
                          in an Amazon S3 bucket.
                        properties:
                          bucket:
                            description: The S3 bucket name.
                            type: string
                          key:
                            description: |-
                              The S3 bucket key, ie: 'my/bucket/prefix'
                              The file name will be automatically generated by the opendepot-module-controller.
                            type: string
                          region:
                            description: The AWS region for the bucket.
                            type: string
                        required:
                        - bucket
                        - region
                        type: object
                    type: object
                  tagPrefix:
                    description: |-
                      The prefix of the Git tags that version this source, such as 'my-skill/'. The prefix is
                      stripped from each tag to produce the version. If omitted, tags are used as-is.
                    type: string
                  versionConstraints:
                    description: |-
                      A comma separated list of version constraints such as '1.2.1' or '>= 1.0.0, < 2.0.0' or '~> 1.0.0, != 1.0.2'.
                      This field is only respected by the Depot controller and selects tag mode. It cannot be set with ref.
                    type: string
                  versionHistoryLimit:
                    description: The number of versions to keep stored in the registry
                      at any given time.
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: ref and versionConstraints are mutually exclusive
                  rule: '!has(self.ref) || !has(self.versionConstraints) || size(self.versionConstraints)
                    == 0'
                - message: tagPrefix is not used with ref
                  rule: '!has(self.ref) || !has(self.tagPrefix)'
                - message: branchPolicy requires ref
                  rule: '!has(self.branchPolicy) || has(self.ref)'
              forceSync:
                description: A flag to force an agent to synchronize
                type: boolean
              versions:
                description: |-
                  The version of the agent. This should be a list of maps with semantic version tags. For example, 'version: v1.0.0', or 'version: 1.0.0'.
                  The version controller will automatically trim any leading 'v' character to make them compatible
                  with the registry protocol. Entries for a branch source (ref) hold a commit and a state, and their
                  version stays empty until the Version controller assigns one.
                items:
                  description: AgentVersion holds details about the Version resource
                    under management.
                  properties:
                    commit:
                      description: The full commit SHA of a branch entry. Set only
                        when the source uses ref.
                      pattern: ^[0-9a-f]{40}$
                      type: string
                    discoveredAt:
                      description: The time the controller first saw the commit. This
                        is the ordering key for branch entries.
                      format: date-time
                      type: string
                    fileName:
                      description: The randomly generated filename with its file extension.
                      type: string
                    name:
                      description: The name of the Version resource that holds this
                        entry. Set only for branch entries.
                      type: string
                    state:
                      description: The lifecycle state of a branch entry, set by the
                        Agent controller. Only Pending, Assigned, and Rejected are
                        valid.
                      enum:
                      - Pending
                      - Assigned
                      - Rejected
                      type: string
                    synced:
                      description: Whether the Version for the Agent has synced or
                        not.
                      type: boolean
                    version:
                      description: The version of the agent. Branch entries have an
                        empty version until the Version controller assigns one.
                      type: string
                  type: object
                type: array
            required:
            - agentSourceConfig
            - versions
            type: object
          status:
            description: AgentStatus defines the observed state of an agent.
            properties:
              latestVersion:
                description: The latest available version of the agent
                type: string
              syncStatus:
                description: A field for declaring current status information about
                  how the resource is being reconciled
                type: string
              synced:
                description: A flag to determine if the agent has successfully synced
                  to its desired state
                type: boolean
              versionRefs:
                additionalProperties:
                  description: AgentVersion holds details about the Version resource
                    under management.
                  properties:
                    commit:
                      description: The full commit SHA of a branch entry. Set only
                        when the source uses ref.
                      pattern: ^[0-9a-f]{40}$
                      type: string
                    discoveredAt:
                      description: The time the controller first saw the commit. This
                        is the ordering key for branch entries.
                      format: date-time
                      type: string
                    fileName:
                      description: The randomly generated filename with its file extension.
                      type: string
                    name:
                      description: The name of the Version resource that holds this
                        entry. Set only for branch entries.
                      type: string
                    state:
                      description: The lifecycle state of a branch entry, set by the
                        Agent controller. Only Pending, Assigned, and Rejected are
                        valid.
                      enum:
                      - Pending
                      - Assigned
                      - Rejected
                      type: string
                    synced:
                      description: Whether the Version for the Agent has synced or
                        not.
                      type: boolean
                    version:
                      description: The version of the agent. Branch entries have an
                        empty version until the Version controller assigns one.
                      type: string
                  type: object
                description: A slice of the AgentVersionRefs that have been successfully
                  created by the controller
                type: object
            required:
            - syncStatus
            - synced
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
