---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: versions.opendepot.defdev.io
spec:
  group: opendepot.defdev.io
  names:
    kind: Version
    listKind: VersionList
    plural: versions
    singular: version
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The type of resource. Either 'Module' or 'Provider'
      jsonPath: .spec.type
      name: Type
      type: string
    - description: Whether the Version has synced successfully
      jsonPath: .status.synced
      name: Synced
      type: string
    - description: The base64 encoded SHA256 checksum of the file Version
      jsonPath: .status.checksum
      name: Checksum
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Version is the Schema for the Version API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VersionSpec defines a specific version of a OpenDepot Module,
              Provider, Skill, or Agent.
            properties:
              agentSourceRef:
                description: The reference to the Skill or Agent resource's config.
                properties:
                  githubClientConfig:
                    description: The Github client configuration settings.
                    properties:
                      useAuthenticatedClient:
                        description: |-
                          This flag determines whether the GitHub client used to download modules
                          will be authenticated with a Github App. It's highly recommended
                          to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                          must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                          githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                          as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                          to authenticate with the Github API.
                        type: boolean
                    type: object
                  immutable:
                    description: |-
                      When true, enforces that the ChecksumSHA256 of the archive always matches the value stored in this field
                      and in any destination storage config.
                    type: boolean
                  jevPolicy:
                    description: |-
                      The thresholds that gate a Version on its Jev assessment. When omitted, or when every threshold
                      is unset, Jev results are informational only.
                    properties:
                      maxDestructiveProbability:
                        description: The maximum destructive action probability. A
                          Version is blocked when its probability is above this value.
                        type: number
                      maxExfiltrationProbability:
                        description: The maximum data exfiltration probability. A
                          Version is blocked when its probability is above this value.
                        type: number
                      maxHiddenInstructionsProbability:
                        description: The maximum hidden instructions probability.
                          A Version is blocked when its probability is above this
                          value.
                        type: number
                      maxInjectionProbability:
                        description: The maximum prompt injection probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      maxRemoteExecutionProbability:
                        description: The maximum remote execution probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      maxRiskScore:
                        description: The maximum risk score. A Version is blocked
                          when its risk score is above this value.
                        type: number
                      maxScopeMismatchProbability:
                        description: The maximum scope mismatch probability. A Version
                          is blocked when its probability is above this value.
                        type: number
                      minConfidence:
                        description: |-
                          The minimum risk confidence. A Version whose risk confidence is below this value is flagged
                          for review but is never blocked.
                        type: number
                      minSafeProbability:
                        description: The minimum safe probability. A Version is blocked
                          when its safe probability is below this value.
                        type: number
                    type: object
                  jevSecretRef:
                    description: |-
                      A reference to the key in a Secret in the same namespace that holds the TypeSafe Jev token.
                      The key defaults to 'jevToken' when omitted. Jev only runs when the version controller has
                      Jev enabled and this reference is set.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  name:
                    description: |-
                      The name of the skill or agent. If omitted, the name of the Skill or Agent resource
                      is used in its place.
                    type: string
                  path:
                    description: |-
                      The path within the repository to the directory that contains the skill or agent.
                      If omitted, the repository root is used.
                    type: string
                  platform:
                    description: |-
                      The agent platform that the skill or agent targets. The frontmatter keys are validated against
                      that platform's known keys. When omitted, the keys of every supported platform are accepted.
                    enum:
                    - agentskills
                    - claude
                    - copilot
                    - codex
                    - opencode
                    - pi
                    type: string
                  repoOwner:
                    description: Owner of the Github repository.
                    type: string
                  repoUrl:
                    description: The full URL of the Github repository.
                    type: string
                  storageConfig:
                    description: The external storage configuration settings.
                    properties:
                      azureStorage:
                        properties:
                          accountName:
                            description: The Azure Storage Account name.
                            type: string
                          accountUrl:
                            description: The Azure Storage Account URL.
                            type: string
                          resourceGroup:
                            description: The Azure Resource Group where the Azure
                              Storage Account is located.
                            type: string
                          subscriptionID:
                            description: The Azure subscription ID where the Azure
                              Storage Account is located.
                            type: string
                        required:
                        - accountName
                        - accountUrl
                        - resourceGroup
                        - subscriptionID
                        type: object
                      fileSystem:
                        description: The configuration settings for storing Versions
                          on a local filesystem.
                        properties:
                          directoryPath:
                            description: The directory path on the file system where
                              the Version will be stored.
                            type: string
                        type: object
                      gcs:
                        description: The configuration settings for storing Versions
                          in a Google Cloud Storage bucket.
                        properties:
                          bucket:
                            description: The GCS bucket name.
                            type: string
                        required:
                        - bucket
                        type: object
                      presign:
                        description: Presign is the optional configuration for pre-signed
                          URL generation.
                        properties:
                          enabled:
                            description: When true, download requests are redirected
                              to the storage backend via a pre-signed URL.
                            type: boolean
                          fallbackToProxy:
                            default: true
                            description: |-
                              When true, if pre-sign generation fails the server falls back to proxying the download.
                              Defaults to true.
                            type: boolean
                          ttl:
                            default: 15m
                            description: |-
                              TTL controls how long the pre-signed URL remains valid (e.g. "15m", "1h").
                              If omitted, defaults to 15 minutes.
                            type: string
                        type: object
                      s3:
                        description: The configuration settings for storing Versions
                          in an Amazon S3 bucket.
                        properties:
                          bucket:
                            description: The S3 bucket name.
                            type: string
                          key:
                            description: |-
                              The S3 bucket key, ie: 'my/bucket/prefix'
                              The file name will be automatically generated by the opendepot-module-controller.
                            type: string
                          region:
                            description: The AWS region for the bucket.
                            type: string
                        required:
                        - bucket
                        - region
                        type: object
                    type: object
                  tagPrefix:
                    description: |-
                      The prefix of the Git tags that version this source, such as 'my-skill/'. The prefix is
                      stripped from each tag to produce the version. If omitted, tags are used as-is.
                    type: string
                  versionConstraints:
                    description: |-
                      A comma separated list of version constraints such as '1.2.1' or '>= 1.0.0, < 2.0.0' or '~> 1.0.0, != 1.0.2'.
                      This field is only respected by the Depot controller.
                    type: string
                  versionHistoryLimit:
                    description: The number of versions to keep stored in the registry
                      at any given time.
                    type: integer
                type: object
              architecture:
                description: The system architecture this Version of the Provider
                  supports.
                type: string
              fileName:
                description: |-
                  The name of the file with its extension.
                  For a Module the file extension must be one of .zip or .tar.gz
                  since OpenTofu currently only supports these two
                  extension types.
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                type: string
              forceSync:
                description: A flag to force a module version to synchronize.
                type: boolean
              moduleConfigRef:
                description: The reference to the Module resource's config.
                properties:
                  fileFormat:
                    description: |-
                      The file format of the module
                      This must be one of 'zip' or 'tar'.
                    type: string
                  githubClientConfig:
                    description: The Github client configuration settings.
                    properties:
                      useAuthenticatedClient:
                        description: |-
                          This flag determines whether the GitHub client used to download modules
                          will be authenticated with a Github App. It's highly recommended
                          to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                          must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                          githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                          as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                          to authenticate with the Github API.
                        type: boolean
                    type: object
                  immutable:
                    description: |-
                      When true, enforces that the ChecksumSHA256 of the module archive
                      always matches the value stored in this field and in any destination storage config.
                    type: boolean
                  name:
                    description: |-
                      The name of the module. If omitted, the name of the Module resource
                      is used in its place.
                    type: string
                  provider:
                    description: The main OpenTofu provider required for this module.
                    type: string
                  repoOwner:
                    description: Owner of the Github repository.
                    type: string
                  repoUrl:
                    description: The full URL of the Github repository.
                    type: string
                  storageConfig:
                    description: The external storage configuration settings.
                    properties:
                      azureStorage:
                        properties:
                          accountName:
                            description: The Azure Storage Account name.
                            type: string
                          accountUrl:
                            description: The Azure Storage Account URL.
                            type: string
                          resourceGroup:
                            description: The Azure Resource Group where the Azure
                              Storage Account is located.
                            type: string
                          subscriptionID:
                            description: The Azure subscription ID where the Azure
                              Storage Account is located.
                            type: string
                        required:
                        - accountName
                        - accountUrl
                        - resourceGroup
                        - subscriptionID
                        type: object
                      fileSystem:
                        description: The configuration settings for storing Versions
                          on a local filesystem.
                        properties:
                          directoryPath:
                            description: The directory path on the file system where
                              the Version will be stored.
                            type: string
                        type: object
                      gcs:
                        description: The configuration settings for storing Versions
                          in a Google Cloud Storage bucket.
                        properties:
                          bucket:
                            description: The GCS bucket name.
                            type: string
                        required:
                        - bucket
                        type: object
                      presign:
                        description: Presign is the optional configuration for pre-signed
                          URL generation.
                        properties:
                          enabled:
                            description: When true, download requests are redirected
                              to the storage backend via a pre-signed URL.
                            type: boolean
                          fallbackToProxy:
                            default: true
                            description: |-
                              When true, if pre-sign generation fails the server falls back to proxying the download.
                              Defaults to true.
                            type: boolean
                          ttl:
                            default: 15m
                            description: |-
                              TTL controls how long the pre-signed URL remains valid (e.g. "15m", "1h").
                              If omitted, defaults to 15 minutes.
                            type: string
                        type: object
                      s3:
                        description: The configuration settings for storing Versions
                          in an Amazon S3 bucket.
                        properties:
                          bucket:
                            description: The S3 bucket name.
                            type: string
                          key:
                            description: |-
                              The S3 bucket key, ie: 'my/bucket/prefix'
                              The file name will be automatically generated by the opendepot-module-controller.
                            type: string
                          region:
                            description: The AWS region for the bucket.
                            type: string
                        required:
                        - bucket
                        - region
                        type: object
                    type: object
                  versionConstraints:
                    description: |-
                      A comma separated list of version constraints such as
                      '1.2.1' or '>= 1.0.0, < 2.0.0' or '~> 1.0.0, != 1.0.2'. This field is only
                      respected by the Depot controller.
                    type: string
                  versionHistoryLimit:
                    description: The number of versions to keep stored in the registry
                      at any given time.
                    type: integer
                type: object
              operatingSystem:
                description: The operating system this Version of the Provider supports.
                type: string
              providerConfigRef:
                description: The reference to the Provider resource's config.
                properties:
                  architectures:
                    description: The architecture(s) that the provider supports. This
                      is used to set the 'arch' constraint in the provider's versions.
                    items:
                      type: string
                    type: array
                  githubClientConfig:
                    description: |-
                      The Github client configuration settings for source scanning. When set with
                      useAuthenticatedClient: true, the version controller will use a GitHub App to
                      authenticate requests when fetching the provider's go.mod for source scanning.
                      This is recommended for private source repositories and to avoid GitHub API rate limiting.
                      The namespace where the Version resource exists must contain a Secret named
                      'opendepot-github-application-secret' with githubAppID, githubInstallID, and
                      githubPrivateKey fields (private key must be base64 encoded).
                    properties:
                      useAuthenticatedClient:
                        description: |-
                          This flag determines whether the GitHub client used to download modules
                          will be authenticated with a Github App. It's highly recommended
                          to enable this flag to avoid GitHub API rate limiting. When enabled, the namespace where the Module resource exists
                          must contain a Secret named 'opendepot-github-application-secret'. The secret must contain a githubAppID,
                          githubInstallID, and githubPrivateKey field. The private key must also be base64 encoded before being added
                          as data to the secret. When accessed, the controller will base64 decode the key to build an in-memory client
                          to authenticate with the Github API.
                        type: boolean
                    type: object
                  name:
                    description: |-
                      The name of the provider. If omitted, the name of the Provider resource
                      is used in its place.
                    type: string
                  namespace:
                    description: |-
                      The namespace (organization) of the provider in the configured upstream registry,
                      e.g. 'hashicorp', 'integrations', 'DataDog'. Defaults to 'hashicorp' when omitted,
                      preserving backwards compatibility for existing Provider resources.
                    type: string
                  operatingSystems:
                    description: The OS(s) that the provider supports. This is used
                      to set the 'os' constraint in the provider's versions.
                    items:
                      type: string
                    type: array
                  sourceRepository:
                    description: |-
                      The URL of the provider's source repository on GitHub, e.g. 'https://github.com/hashicorp/terraform-provider-aws'.
                      When omitted, OpenDepot looks up the repository from the OpenTofu registry (api.opentofu.org).
                      If the registry lookup fails, it falls back to 'github.com/{namespace}/terraform-provider-{name}'.
                      If the repository cannot be resolved, scanning falls back to binary-only mode.
                    type: string
                  storageConfig:
                    description: The external storage configuration settings.
                    properties:
                      azureStorage:
                        properties:
                          accountName:
                            description: The Azure Storage Account name.
                            type: string
                          accountUrl:
                            description: The Azure Storage Account URL.
                            type: string
                          resourceGroup:
                            description: The Azure Resource Group where the Azure
                              Storage Account is located.
                            type: string
                          subscriptionID:
                            description: The Azure subscription ID where the Azure
                              Storage Account is located.
                            type: string
                        required:
                        - accountName
                        - accountUrl
                        - resourceGroup
                        - subscriptionID
                        type: object
                      fileSystem:
                        description: The configuration settings for storing Versions
                          on a local filesystem.
                        properties:
                          directoryPath:
                            description: The directory path on the file system where
                              the Version will be stored.
                            type: string
                        type: object
                      gcs:
                        description: The configuration settings for storing Versions
                          in a Google Cloud Storage bucket.
                        properties:
                          bucket:
                            description: The GCS bucket name.
                            type: string
                        required:
                        - bucket
                        type: object
                      presign:
                        description: Presign is the optional configuration for pre-signed
                          URL generation.
                        properties:
                          enabled:
                            description: When true, download requests are redirected
                              to the storage backend via a pre-signed URL.
                            type: boolean
                          fallbackToProxy:
                            default: true
                            description: |-
                              When true, if pre-sign generation fails the server falls back to proxying the download.
                              Defaults to true.
                            type: boolean
                          ttl:
                            default: 15m
                            description: |-
                              TTL controls how long the pre-signed URL remains valid (e.g. "15m", "1h").
                              If omitted, defaults to 15 minutes.
                            type: string
                        type: object
                      s3:
                        description: The configuration settings for storing Versions
                          in an Amazon S3 bucket.
                        properties:
                          bucket:
                            description: The S3 bucket name.
                            type: string
                          key:
                            description: |-
                              The S3 bucket key, ie: 'my/bucket/prefix'
                              The file name will be automatically generated by the opendepot-module-controller.
                            type: string
                          region:
                            description: The AWS region for the bucket.
                            type: string
                        required:
                        - bucket
                        - region
                        type: object
                    type: object
                  upstreamRegistry:
                    default: registry.opentofu.org
                    description: |-
                      The canonical registry used to discover and download this provider and exposed by the Provider Network Mirror Protocol.
                      Defaults to registry.opentofu.org when omitted.
                    enum:
                    - registry.opentofu.org
                    - registry.terraform.io
                    type: string
                  versionConstraints:
                    description: |-
                      A comma-separated list of version constraints such as
                      '1.2.1' or '>= 1.0.0, < 2.0.0' or '~> 1.0.0'. This field is only
                      respected by the Depot controller.
                    type: string
                  versionHistoryLimit:
                    description: The version history limit for the provider.
                    type: integer
                type: object
              type:
                description: The type of resource. One of 'Module', 'Provider', 'Skill',
                  or 'Agent'
                type: string
              version:
                description: The version of the Module, Provider, Skill, or Agent.
                type: string
              yanked:
                description: |-
                  Whether the Version has been yanked. A yanked Version stays listed but is skipped
                  when resolving version constraints.
                type: boolean
            required:
            - type
            - version
            type: object
          status:
            description: VersionStatus defines the current status of the resource.
            properties:
              agentMetadata:
                description: AgentMetadata holds the frontmatter fields parsed from
                  a skill or agent Version.
                properties:
                  description:
                    description: The description declared in the definition's frontmatter.
                    type: string
                  model:
                    description: The model declared in the definition's frontmatter.
                    type: string
                  name:
                    description: The name declared in the definition's frontmatter.
                    type: string
                  tools:
                    description: The tools declared in the definition's frontmatter.
                    items:
                      type: string
                    type: array
                type: object
              archiveSizeBytes:
                description: |-
                  ArchiveSizeBytes is the size in bytes of the stored archive, set by the Version
                  controller after a successful PutObject. Nil when the archive has not yet been uploaded.
                format: int64
                type: integer
              binaryScan:
                description: |-
                  The binary vulnerability scan result for this specific provider artifact.
                  Only populated for provider Version resources when scanning is enabled.
                properties:
                  findings:
                    description: The list of vulnerabilities found in the compiled
                      provider binary.
                    items:
                      description: SecurityFinding represents a single vulnerability
                        finding from a Trivy scan.
                      properties:
                        exempted:
                          description: |-
                            Whether a ScanPolicy exempted this finding from blocking reconciliation. Exempted
                            findings are still reported so that they remain visible and auditable.
                          type: boolean
                        exemptedBy:
                          description: The name of the ScanPolicy that exempted this
                            finding.
                          type: string
                        exemptionReason:
                          description: The justification recorded on the ScanPolicy
                            exemption that covered this finding.
                          type: string
                        fixedVersion:
                          description: The minimum version of the package that resolves
                            the vulnerability, if known.
                          type: string
                        installedVersion:
                          description: The version of the package currently in use.
                          type: string
                        pkgName:
                          description: The name of the package containing the vulnerability.
                          type: string
                        severity:
                          description: 'The severity of the vulnerability: CRITICAL,
                            HIGH, MEDIUM, LOW, or UNKNOWN.'
                          type: string
                        title:
                          description: A short description of the vulnerability.
                          type: string
                        vulnerabilityID:
                          description: The CVE or GHSA identifier for the vulnerability.
                          type: string
                      required:
                      - installedVersion
                      - pkgName
                      - severity
                      - vulnerabilityID
                      type: object
                    type: array
                  scannedAt:
                    description: The RFC3339 timestamp at which the binary scan completed.
                    type: string
                required:
                - scannedAt
                type: object
              checksum:
                description: The SHA256 checksum of the module as a base64 encoded
                  string.
                type: string
              contractConfigMapRef:
                description: |-
                  ContractConfigMapRef references the ConfigMap holding this module Version's
                  Assembly Line contract JSON. Only populated for module Version resources when
                  contract derivation is enabled.
                properties:
                  derivedAt:
                    description: The RFC3339 timestamp at which the contract was derived.
                    type: string
                  grade:
                    description: The compatibility grade of this module for Assembly
                      Line.
                    enum:
                    - full
                    - partial
                    - unsupported
                    type: string
                  key:
                    description: The key within the ConfigMap's data holding the contract
                      JSON.
                    type: string
                  name:
                    description: The name of the ConfigMap holding the contract.
                    type: string
                required:
                - derivedAt
                - grade
                - key
                - name
                type: object
              jevAssessment:
                description: |-
                  JevAssessment holds the TypeSafe Jev assessment of this Version. Only populated when Jev
                  is enabled and the source opts in with jevSecretRef.
                properties:
                  blockReasons:
                    description: The JevPolicy thresholds that were crossed when the
                      Version is blocked.
                    items:
                      type: string
                    type: array
                  blocked:
                    description: Whether a configured JevPolicy threshold blocks the
                      Version.
                    type: boolean
                  destructiveProbability:
                    description: The probability that the Version directs destructive
                      or irreversible actions.
                    type: number
                  error:
                    description: A redacted description of the error that prevented
                      the assessment from completing.
                    type: string
                  evaluatedAt:
                    description: The RFC3339 timestamp at which the assessment was
                      evaluated.
                    type: string
                  exfiltrationProbability:
                    description: The probability that the Version directs data, files,
                      or credentials to an external destination.
                    type: number
                  hiddenInstructionsProbability:
                    description: The probability that the Version contains hidden
                      or obfuscated instructions.
                    type: number
                  injectionProbability:
                    description: The probability that the Version is susceptible to
                      prompt injection.
                    type: number
                  model:
                    description: The Jev model that produced the assessment, as returned
                      by the API.
                    type: string
                  needsReview:
                    description: Whether the assessment requires a manual review.
                    type: boolean
                  remoteExecutionProbability:
                    description: The probability that the Version directs the agent
                      to download and run remote code.
                    type: number
                  riskConfidence:
                    description: The confidence of the risk assessment. This describes
                      answer concentration, not correctness.
                    type: number
                  riskLevel:
                    description: The risk level assigned to the Version.
                    enum:
                    - Minimal
                    - Low
                    - Moderate
                    - High
                    - Critical
                    type: string
                  riskScore:
                    description: The risk score assigned to the Version.
                    type: number
                  safeProbability:
                    description: The probability that the Version is safe to use.
                    type: number
                  scopeMismatchProbability:
                    description: The probability that the Version asks the agent to
                      do things beyond its description.
                    type: number
                required:
                - blocked
                - evaluatedAt
                - needsReview
                type: object
              providerSchemaRef:
                description: |-
                  ProviderSchemaRef references the reduced provider schema stored in the object
                  storage backend for this provider Version. Only populated for provider Version
                  resources whose OS/arch matches the controller's own platform.
                properties:
                  digest:
                    description: The SHA256 digest of the uncompressed reduced schema,
                      as a hex string.
                    type: string
                  extractedAt:
                    description: The RFC3339 timestamp at which the schema was extracted.
                    type: string
                  key:
                    description: The storage key of the gzipped reduced schema object.
                    type: string
                  sizeBytes:
                    description: The size in bytes of the stored gzipped object.
                    format: int64
                    type: integer
                required:
                - digest
                - extractedAt
                - key
                - sizeBytes
                type: object
              providerSchemaStatus:
                description: |-
                  ProviderSchemaStatus records the outcome of the most recent provider schema
                  extraction attempt. Unlike ProviderSchemaRef, which is only ever set on success,
                  this field is also set when an extraction attempt fails, so the failure is
                  visible instead of the Version silently having no schema. Only populated for
                  provider Version resources whose OS/arch matches the controller's own platform.
                properties:
                  attemptedAt:
                    description: The RFC3339 timestamp of the most recent extraction
                      attempt.
                    type: string
                  message:
                    description: A human readable description of the failure. Only
                      set when state is Failed.
                    type: string
                  state:
                    description: The outcome of the most recent extraction attempt.
                    enum:
                    - Succeeded
                    - Failed
                    type: string
                required:
                - attemptedAt
                - state
                type: object
              readmeConfigMapRef:
                description: |-
                  ReadmeConfigMapRef references the ConfigMap holding this module Version's base64
                  encoded README.md content. Only populated for module Version resources when a
                  README could be resolved from Github or the module archive.
                properties:
                  key:
                    description: The key within the ConfigMap's data holding the base64
                      encoded README content.
                    type: string
                  name:
                    description: The name of the ConfigMap holding the README content.
                    type: string
                required:
                - key
                - name
                type: object
              shaSums:
                description: ShaSums is the SHA256SUMS file for this Version, produced
                  and signed once at sync.
                type: string
              shaSumsSignature:
                description: |-
                  ShaSumsSignature is the detached signature over ShaSums, produced at sync with the
                  provider GPG signing key.
                type: string
              signingKeyFingerprint:
                description: SigningKeyFingerprint is the fingerprint of the key that
                  produced ShaSumsSignature.
                type: string
              sourceScan:
                description: |-
                  The source vulnerability scan result for this Version. Populated for provider Versions
                  (go.mod scan) and module Versions (IaC filesystem scan) when scanning is enabled.
                properties:
                  findings:
                    description: The list of findings produced by the scan.
                    items:
                      description: SecurityFinding represents a single vulnerability
                        finding from a Trivy scan.
                      properties:
                        exempted:
                          description: |-
                            Whether a ScanPolicy exempted this finding from blocking reconciliation. Exempted
                            findings are still reported so that they remain visible and auditable.
                          type: boolean
                        exemptedBy:
                          description: The name of the ScanPolicy that exempted this
                            finding.
                          type: string
                        exemptionReason:
                          description: The justification recorded on the ScanPolicy
                            exemption that covered this finding.
                          type: string
                        fixedVersion:
                          description: The minimum version of the package that resolves
                            the vulnerability, if known.
                          type: string
                        installedVersion:
                          description: The version of the package currently in use.
                          type: string
                        pkgName:
                          description: The name of the package containing the vulnerability.
                          type: string
                        severity:
                          description: 'The severity of the vulnerability: CRITICAL,
                            HIGH, MEDIUM, LOW, or UNKNOWN.'
                          type: string
                        title:
                          description: A short description of the vulnerability.
                          type: string
                        vulnerabilityID:
                          description: The CVE or GHSA identifier for the vulnerability.
                          type: string
                      required:
                      - installedVersion
                      - pkgName
                      - severity
                      - vulnerabilityID
                      type: object
                    type: array
                  scannedAt:
                    description: The RFC3339 timestamp at which the source scan completed.
                    type: string
                required:
                - scannedAt
                type: object
              syncStatus:
                description: The Version's reconciliation status.
                type: string
              synced:
                description: A flag that determines whether the Version has been successfully
                  reconciled.
                type: boolean
            required:
            - syncStatus
            - synced
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
